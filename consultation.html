
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation des importations</title>

<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f9;color:#263445}
h2{color:#17365d}
.container{max-width:1200px;margin:auto}
#message{padding:12px;margin:12px 0;background:#e8eef7;border-radius:8px}
.filtres{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}
.filtres input{flex:2 1 300px;min-width:200px}
.filtres select{flex:1 1 180px;min-width:160px}
.filtres input,.filtres select,.filtres button{padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.filtres button,.btn-articles{background:#17365d;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}
#dossiers{display:grid;grid-template-columns:1fr;gap:16px}
.dossier-card{background:white;border:1px solid #dce3ec;border-radius:12px;padding:18px;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.dossier-card h3{color:#17365d;margin:0 0 12px}
.dossier-infos{display:flex;flex-wrap:wrap;gap:10px 24px;margin-bottom:14px}
.statut-dossier{display:inline-block;padding:6px 10px;border-radius:20px;background:#e8eef7;color:#17365d;font-weight:bold}
.type-dossier{display:inline-block;padding:5px 9px;border-radius:5px;background:#e2f1e9;color:#17613b;font-size:12px;font-weight:bold;margin-bottom:10px}
.type-groupage{background:#fff0d9;color:#855000}
.modal-articles{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:15px}
.modal-contenu{background:white;width:100%;max-width:850px;max-height:85vh;overflow-y:auto;border-radius:12px;padding:22px}
.modal-contenu table{width:100%;min-width:650px;border-collapse:collapse;margin:12px 0}
.modal-contenu th,.modal-contenu td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.modal-contenu th{background:#17365d;color:white}
.btn-fermer{float:right;border:0;background:#17365d;color:white;padding:8px 14px;border-radius:6px;cursor:pointer}
.bloc-fournisseur{border:1px solid #dce3ec;border-radius:8px;padding:12px;margin:12px 0}
@media(max-width:600px){
 body{margin:10px}
 .dossier-infos{flex-direction:column;gap:8px}
 .filtres input,.filtres select{flex:1 1 100%;width:100%}
}
</style>
</head>

<body>
<div class="container">
<h2>Suivi des importations</h2>
<p>Page de consultation — accès en lecture seule</p>

<div id="message">Chargement des dossiers...</div>

<div class="filtres">
<input type="search" id="recherche"
placeholder="Rechercher fournisseur, groupage, conteneur, BL, article...">

<select id="filtreStatut">
<option value="">Tous les statuts</option>
<option value="Commandée">Commandée</option>
<option value="En préparation">En préparation</option>
<option value="Chargé">Chargé</option>
<option value="En transit">En transit</option>
<option value="Arrivé au port">Arrivé au port</option>
<option value="Dédouanement">Dédouanement</option>
<option value="En livraison">En livraison</option>
<option value="Livré">Livré</option>
<option value="Bloqué">Bloqué</option>
<option value="Annulée">Annulée</option>
</select>

<button type="button" id="reinitialiser">Réinitialiser</button>
</div>

<div id="dossiers"></div>

<div id="modalArticles" class="modal-articles">
<div class="modal-contenu">
<button type="button" class="btn-fermer" onclick="fermerArticles()">Fermer ✕</button>
<h2 id="titreModal">Détails du dossier</h2>
<div id="contenuArticles"></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://mnyokiniupvtzesdmwit.supabase.co';
const KEY = 'sb_publishable_-HIf7IptcZ1as_TXkn5SCQ_Fx6lPnbi';

const db = window.supabase.createClient(SUPABASE_URL, KEY);

let tousLesDossiers = [];

function safe(value) {
  return String(value ?? '—').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function normaliser(valeur) {
  return String(valeur ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();
}

function obtenirArticles(s) {
  if (Array.isArray(s.articles) && s.articles.length) {
    return s.articles;
  }

  if (typeof s.articles === 'string') {
    try {
      const resultat = JSON.parse(s.articles);
      if (Array.isArray(resultat)) return resultat;
    } catch(e) {}
  }

  if (s.article_names) {
    return [{
      reference: s.article_reference || '',
      name: s.article_names,
      quantity: s.quantity,
      unit: s.unit
    }];
  }

  return [];
}

function calculerTotaux(articles) {
  const totaux = {};

  articles.forEach(a => {
    const unite = a.unit || 'Autre';
    totaux[unite] = (totaux[unite] || 0) +
      (Number(a.quantity) || 0);
  });

  return Object.entries(totaux)
    .map(([unite,total]) =>
      total.toLocaleString('fr-FR') + ' ' + unite
    ).join(' · ');
}

/* Transformer les lignes SQL en groupages complets */
function organiserGroupages(lignes) {
  const groupes = new Map();

  (lignes || []).forEach(ligne => {
    const id = ligne.group_id;
    if (!id) return;

    if (!groupes.has(id)) {
      groupes.set(id, {
        type: 'groupage',
        group_id: id,
        group_reference: ligne.group_reference,
        transport_mode: ligne.transport_mode,
        transport_unit_reference: ligne.transport_unit_reference,
        transporter: ligne.transporter,
        origin: ligne.origin,
        destination: ligne.destination,
        load_date: ligne.load_date,
        status: ligne.group_status,
        fournisseurs: []
      });
    }

    if (ligne.shipment_id) {
      groupes.get(id).fournisseurs.push({
        id: ligne.shipment_id,
        supplier: ligne.supplier,
        reference: ligne.supplier_reference,
        invoice: ligne.invoice,
        container: ligne.container,
        bl: ligne.bl,
        status: ligne.supplier_status,
        article_names: ligne.article_names,
        quantity: ligne.quantity,
        unit: ligne.unit,
        articles: ligne.articles
      });
    }
  });

  return Array.from(groupes.values());
}

/* Affichage des articles dans une table */
function tableauArticles(articles) {
  const lignes = articles.map(a => `
    <tr>
      <td>${safe(a.reference || '')}</td>
      <td>${safe(a.name || '')}</td>
      <td>${safe(a.quantity ?? '')}</td>
      <td>${safe(a.unit || '')}</td>
      <td>${safe(a.availability || 'Non renseigné')}</td>
      <td>${safe(a.availableQuantity ?? 'Non renseigné')}</td>
      <td>${safe(a.expectedAvailabilityDate || 'Non renseignée')}</td>
      <td>${safe(a.supplierComment || 'Aucun commentaire')}</td>
    </tr>
  `).join('');

  return `
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Référence</th>
            <th>Désignation</th>
            <th>Quantité</th>
            <th>Unité</th>
            <th>Disponibilité</th>
            <th>Quantité disponible</th>
            <th>Date de disponibilité</th>
            <th>Commentaire fournisseur</th>
          </tr>
        </thead>
        <tbody>
          ${lignes || '<tr><td colspan="8">Aucun article enregistré.</td></tr>'}
        </tbody>
      </table>
    </div>
    <p><strong>Total :</strong> ${safe(calculerTotaux(articles) || 'Aucun article')}</p>
  `;
}

/* Ouvrir les détails d'un dossier individuel ou d'un groupage */
function ouvrirArticles(index) {
  const dossier = tousLesDossiers[index];
  if (!dossier) return;

  const contenu = document.getElementById('contenuArticles');

  if (dossier.type === 'groupage') {
    document.getElementById('titreModal').textContent =
      'Groupage — ' + (dossier.group_reference || 'Sans référence');

    contenu.innerHTML = `
      <p><strong>Référence :</strong> ${safe(dossier.group_reference)}</p>
      <p><strong>Transport :</strong> ${safe(dossier.transport_mode)}</p>
      <p><strong>Unité de transport :</strong> ${safe(dossier.transport_unit_reference)}</p>
      <p><strong>Transporteur :</strong> ${safe(dossier.transporter)}</p>
      <p><strong>Origine :</strong> ${safe(dossier.origin)}</p>
      <p><strong>Destination :</strong> ${safe(dossier.destination)}</p>
      <p><strong>Date de chargement :</strong> ${safe(dossier.load_date)}</p>
      <p><strong>Statut :</strong> ${safe(dossier.status)}</p>
      <hr>
      <h3>Fournisseurs du groupage (${dossier.fournisseurs.length})</h3>

      ${dossier.fournisseurs.map(f => `
        <div class="bloc-fournisseur">
          <h3>${safe(f.supplier || 'Fournisseur non renseigné')}</h3>
          <p><strong>Référence :</strong> ${safe(f.reference)}</p>
          <p><strong>Facture :</strong> ${safe(f.invoice)}</p>
          <p><strong>Conteneur :</strong> ${safe(f.container)}</p>
          <p><strong>BL :</strong> ${safe(f.bl)}</p>
          <p><strong>Statut :</strong> ${safe(f.status)}</p>
          <h4>Articles</h4>
          ${tableauArticles(obtenirArticles(f))}
        </div>
      `).join('')}
    `;
  } else {
    const articles = obtenirArticles(dossier);

    document.getElementById('titreModal').textContent =
      'Articles du dossier — ' + (dossier.supplier || 'Sans fournisseur');

    contenu.innerHTML = `
      <p><strong>Référence :</strong> ${safe(dossier.reference)}</p>
      <p><strong>Fournisseur :</strong> ${safe(dossier.supplier)}</p>
      <p><strong>Facture :</strong> ${safe(dossier.invoice)}</p>
      <p><strong>Conteneur :</strong> ${safe(dossier.container)}</p>
      <p><strong>BL :</strong> ${safe(dossier.bl)}</p>
      <p><strong>Statut :</strong> ${safe(dossier.status)}</p>
      ${tableauArticles(articles)}
    `;
  }

  document.getElementById('modalArticles').style.display = 'flex';
}

function fermerArticles() {
  document.getElementById('modalArticles').style.display = 'none';
}

/* Recherche et filtres */
function appliquerFiltres() {
  const recherche = normaliser(
    document.getElementById('recherche').value
  );

  const statut = normaliser(
    document.getElementById('filtreStatut').value
  );

  const dossiersFiltres = tousLesDossiers
    .map((dossier,index) => ({dossier,index}))
    .filter(({dossier}) => {
      let texte = '';

      if (dossier.type === 'groupage') {
        texte = [
          dossier.group_reference,
          dossier.transport_mode,
          dossier.transport_unit_reference,
          dossier.transporter,
          dossier.origin,
          dossier.destination,
          dossier.status,
          ...dossier.fournisseurs.map(f => [
            f.supplier,f.reference,f.invoice,f.container,f.bl,f.status,
            ...obtenirArticles(f).map(a =>
              [a.reference,a.name,a.quantity,a.unit].join(' ')
            )
          ].join(' '))
        ].join(' ');
      } else {
        texte = [
          dossier.reference,
          dossier.supplier,
          dossier.invoice,
          dossier.container,
          dossier.bl,
          dossier.status,
          ...obtenirArticles(dossier).map(a =>
            [a.reference,a.name,a.quantity,a.unit].join(' ')
          )
        ].join(' ');
      }

      const correspondRecherche =
        normaliser(texte).includes(recherche);

      let correspondStatut = true;

      if (statut) {
        if (dossier.type === 'groupage') {
          correspondStatut =
            normaliser(dossier.status) === statut ||
            dossier.fournisseurs.some(f =>
              normaliser(f.status) === statut
            );
        } else {
          correspondStatut = normaliser(dossier.status) === statut;
        }
      }

      return correspondRecherche && correspondStatut;
    });

  afficherDossiers(dossiersFiltres);
}

/* Affichage des cartes */
function afficherDossiers(liste) {
  const zone = document.getElementById('dossiers');

  if (!liste.length) {
    zone.innerHTML = '<p>Aucun dossier ne correspond à votre recherche.</p>';
    return;
  }

  zone.innerHTML = liste.map(({dossier:s,index}) => {
    if (s.type === 'groupage') {
      const nombre = s.fournisseurs.length;
      const totalArticles = s.fournisseurs.reduce(
        (total,f) => total + obtenirArticles(f).length, 0
      );

      return `
        <div class="dossier-card">
          <span class="type-dossier type-groupage">CHARGEMENT EN GROUPAGE</span>
          <h3>${safe(s.group_reference || 'Groupage sans référence')}</h3>

          <div class="dossier-infos">
            <span><strong>Transport :</strong> ${safe(s.transport_mode)}</span>
            <span><strong>Unité :</strong> ${safe(s.transport_unit_reference)}</span>
            <span><strong>Transporteur :</strong> ${safe(s.transporter)}</span>
            <span><strong>Origine :</strong> ${safe(s.origin)}</span>
            <span><strong>Destination :</strong> ${safe(s.destination)}</span>
            <span><strong>Chargement :</strong> ${safe(s.load_date)}</span>
            <span class="statut-dossier">${safe(s.status)}</span>
          </div>

          <p><strong>${nombre}</strong> fournisseur(s) ·
          <strong>${totalArticles}</strong> article(s)</p>

          <button type="button" class="btn-articles"
            onclick="ouvrirArticles(${index})">
            Voir les fournisseurs et articles
          </button>
        </div>
      `;
    }

    const articles = obtenirArticles(s);

    return `
      <div class="dossier-card">
        <span class="type-dossier">CHARGEMENT INDIVIDUEL</span>
        <h3>${safe(s.reference || 'Dossier')} — ${safe(s.supplier)}</h3>

        <div class="dossier-infos">
          <span><strong>Facture :</strong> ${safe(s.invoice)}</span>
          <span><strong>Conteneur :</strong> ${safe(s.container)}</span>
          <span><strong>BL :</strong> ${safe(s.bl)}</span>
          <span class="statut-dossier">${safe(s.status)}</span>
        </div>

        <p><strong>${articles.length}</strong> article(s)

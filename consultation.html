<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des importations — Consultation</title>
<style>
:root{--navy:#17365d;--blue:#3157d5;--bg:#f4f6f9;--ink:#263445;--muted:#68778b;--line:#dce3ec}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.container{max-width:1250px;margin:auto;padding:24px 18px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;flex-wrap:wrap}
h1,h2,h3{color:var(--navy)}h1{font-size:26px;margin:0 0 6px}header p{margin:0;color:var(--muted)}
#message{padding:12px 14px;margin:16px 0;border-radius:8px;background:#e8eef7;color:var(--navy)}
.filtres{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.filtres input,.filtres select,.filtres button{padding:11px 12px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}
.filtres input{flex:2;min-width:230px}.filtres select{min-width:190px}
button{cursor:pointer}.filtres button,.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:10px 14px}
.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.section-head h2{font-size:20px;margin:0}.count{font-size:13px;color:var(--muted)}
#groupages,#dossiers{display:grid;grid-template-columns:1fr;gap:13px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 7px #00000009}
.card h3{margin:0 0 12px;font-size:17px}
.infos{display:flex;gap:9px 22px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}
.infos span{color:#435166}.infos strong{color:#263445}
.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#e8eef7;color:var(--navy);font-weight:bold;font-size:12px}
.group-members{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.member{padding:12px;margin:9px 0;background:#f8faff;border:1px solid #e3eaf4;border-radius:8px}
.member h4{margin:0 0 7px;color:var(--navy)}
.member p{margin:5px 0;font-size:13px}
.articles{width:100%;border-collapse:collapse;margin-top:8px;min-width:500px}
.articles th,.articles td{padding:8px;border-bottom:1px solid #dce3ec;text-align:left;font-size:13px}
.articles th{background:#eaf0f7;color:var(--navy)}
.table-scroll{overflow-x:auto}
.empty{padding:20px;background:white;border:1px dashed #cbd5e1;border-radius:10px;color:var(--muted)}
.hidden{display:none}
@media(max-width:620px){.container{padding:18px 12px}.infos{flex-direction:column;gap:7px}.filtres input,.filtres select{width:100%;min-width:100%}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<header><div><h1>Suivi des importations</h1><p>Page de consultation — accès en lecture seule</p></div><div id="lastUpdate" class="count"></div></header>
<div id="message">Connexion à la base de données…</div>
<div class="filtres">
<input type="search" id="recherche" placeholder="Rechercher groupage, fournisseur, conteneur, BL, article…">
<select id="filtreStatut"><option value="">Tous les statuts</option>
<option>Commandée</option><option>En préparation</option><option>Chargé</option><option>En transit</option><option>Arrivé au port</option><option>Dédouanement</option><option>En livraison</option><option>Livré</option><option>Bloqué</option><option>Annulée</option></select>
<button type="button" id="reinitialiser">Réinitialiser</button>
</div>
<section class="section" id="sectionGroupages">
<div class="section-head"><h2>Chargements en groupage</h2><span class="count" id="countGroupages"></span></div>
<div id="groupages"><div class="empty">Chargement des groupages…</div></div>
</section>
<section class="section">
<div class="section-head"><h2>Dossiers d’importation</h2><span class="count" id="countDossiers"></span></div>
<div id="dossiers"><div class="empty">Chargement des dossiers…</div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Paramètres Supabase conservés tels quels depuis votre page actuelle. */
const SUPABASE_URL='https://mnyokiniupvtzesdmwit.supabase.co';
const KEY='sb_publishable_-HIf7IptcZ1as_TXkn5SCQ_Fx6lPnbi';
const db=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
let tousLesDossiers=[], tousLesGroupages=[], liensGroupage=[], groupageDisponible=true;
function safe(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normaliser(v){return String(v??'').replace(/<br\s*\/?\s*>/gi,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
function obtenirArticles(s){
 if(Array.isArray(s.articles)&&s.articles.length)return s.articles;
 if(s.article_names||s.articleNames||s.goods)return [{reference:s.article_reference||'',name:s.article_names||s.articleNames||s.goods,quantity:s.quantity,unit:s.unit}];
 return [];
}
function totalArticles(articles){const t={};articles.forEach(a=>{const u=a.unit||'Autre';if(a.quantity!==null&&a.quantity!==undefined&&a.quantity!=='')t[u]=(t[u]||0)+(Number(a.quantity)||0)});return Object.entries(t).map(([u,n])=>n.toLocaleString('fr-FR')+' '+u).join(' · ');}
function statut(s){return s||'Non renseigné';}
function articlesHtml(s){
 const arts=obtenirArticles(s);
 if(!arts.length)return '<p>Aucun article détaillé.</p>';
 return `<div class="table-scroll"><table class="articles"><thead><tr><th>Référence</th><th>Désignation</th><th>Quantité</th><th>Unité</th></tr></thead><tbody>${arts.map(a=>`<tr><td>${safe(a.reference)}</td><td style="white-space:pre-line">${safe(String(a.name||a.designation||'').replace(/<br\s*\/?\s*>/gi,'\n'))}</td><td>${safe(a.quantity)}</td><td>${safe(a.unit)}</td></tr>`).join('')}</tbody></table></div><p><strong>Total :</strong> ${safe(totalArticles(arts)||'—')}</p>`;
}
function rechercherDansDossier(s){
 const arts=obtenirArticles(s);
 return normaliser([s.reference,s.ref,s.supplier,s.container,s.bl,s.invoice,s.status,s.goods,s.article_names,s.origin_port,s.dest_port,s.transporter,...arts.map(a=>[a.reference,a.name,a.designation,a.quantity,a.unit].join(' '))].join(' '));
}
function membreCommeDossier(m){return {...m,reference:m.supplier_reference||m.reference, status:m.supplier_status||m.status};}

function appliquerFiltres(){
 const q=normaliser($('recherche').value);
 const st=normaliser($('filtreStatut').value);

 // Exclure des dossiers ceux qui sont déjà dans un groupage
 const idsEnGroupage = new Set(
   liensGroupage.map(x => String(x.shipment_id))
 );

 const dossiers=tousLesDossiers.filter(s=>
   !idsEnGroupage.has(String(s.id)) &&
   (!q || rechercherDansDossier(s).includes(q)) &&
   (!st || normaliser(s.status)===st)
 );

 const groupes=tousLesGroupages.filter(g=>{
   const membres=liensGroupage.filter(x=>x.group_id===g.id);
   const texte=normaliser([
     g.group_reference,
     g.transport_mode,
     g.transport_unit_reference,
     g.transporter,
     g.origin,
     g.destination,
     g.status,
     ...membres.map(x=>rechercherDansDossier(membreCommeDossier(x)))
   ].join(' '));

   const statutOk=!st ||
     normaliser(g.status)===st ||
     membres.some(x=>normaliser(x.supplier_status||x.status)===st);

   return (!q || texte.includes(q)) && statutOk;
 });

 afficherGroupages(groupes);
 afficherDossiers(dossiers);
}

function afficherGroupages(liste){
 $('countGroupages').textContent=liste.length+' groupage(s)';
 if(!groupageDisponible){$('groupages').innerHTML='<div class="empty">Les chargements groupage ne sont pas accessibles. Vérifiez les autorisations de lecture de la vue groupages_consultation_public dans Supabase.</div>';return;}
 if(!liste.length){$('groupages').innerHTML='<div class="empty">Aucun groupage ne correspond à votre recherche.</div>';return;}
 $('groupages').innerHTML=liste.map(g=>{
  const membres=liensGroupage.filter(x=>x.group_id===g.id);
  const membreHtml=membres.length?membres.map(x=>{const s=membreCommeDossier(x);return `<div class="member"><h4>${safe(s.reference||'Dossier')} — ${safe(s.supplier||'Fournisseur non précisé')}</h4><p><strong>Facture :</strong> ${safe(s.invoice)} &nbsp; <strong>Statut dossier :</strong> ${safe(statut(s.status))}</p><p><strong>Conteneur :</strong> ${safe(s.container)} &nbsp; <strong>BL :</strong> ${safe(s.bl)}</p>${articlesHtml(s)}</div>`;}).join(''):'<p>Aucun dossier fournisseur associé.</p>';
  return `<article class="card"><h3>${safe(g.group_reference||'Groupage')}</h3><div class="infos"><span><strong>Transport :</strong> ${safe(g.transport_mode)}</span><span><strong>Camion / conteneur :</strong> ${safe(g.transport_unit_reference)}</span><span><strong>Transporteur :</strong> ${safe(g.transporter)}</span><span><strong>Trajet :</strong> ${safe(g.origin)} → ${safe(g.destination)}</span><span><strong>Date de chargement :</strong> ${safe(g.load_date)}</span><span><strong>Dossiers :</strong> ${membres.length}</span><span class="status">${safe(statut(g.status))}</span></div><div class="group-members"><strong>Dossiers fournisseurs et articles</strong>${membreHtml}</div></article>`;
 }).join('');
}
function afficherDossiers(liste){
 $('countDossiers').textContent=liste.length+' dossier(s)';
 if(!liste.length){$('dossiers').innerHTML='<div class="empty">Aucun dossier ne correspond à votre recherche.</div>';return;}
 $('dossiers').innerHTML=liste.map(s=>{
  const arts=obtenirArticles(s),g=liensGroupage.find(x=>x.shipment_id===s.id),grp=g&&tousLesGroupages.find(x=>x.id===g.group_id);
  return `<article class="card"><h3>${safe(s.reference||'Dossier')} — ${safe(s.supplier||'Fournisseur non précisé')}</h3><div class="infos"><span><strong>Conteneur :</strong> ${safe(s.container)}</span><span><strong>BL :</strong> ${safe(s.bl)}</span><span><strong>Facture :</strong> ${safe(s.invoice)}</span><span><strong>Groupage :</strong> ${safe(grp?.group_reference||'Non renseigné')}</span><span class="status">${safe(statut(s.status))}</span></div><p><strong>${arts.length}</strong> article(s) · ${safe(totalArticles(arts)||'Total non renseigné')}</p>${articlesHtml(s)}</article>`;
 }).join('');
}
async function charger(){
 $('message').textContent='Chargement des importations depuis Supabase…';
 const dossiersRes=await db.from('shipment_consultation_public').select('*');
 if(dossiersRes.error){$('message').textContent='Erreur de lecture des dossiers (shipment_consultation_public) : '+dossiersRes.error.message;return;}
 tousLesDossiers=(dossiersRes.data||[]);
 const groupagesRes=await db.from('groupages_consultation_public').select('*').order('load_date',{ascending:false});
 if(groupagesRes.error){
  console.error('Erreur de lecture des groupages',groupagesRes.error);
  groupageDisponible=false;tousLesGroupages=[];liensGroupage=[];
 }else{
  liensGroupage=groupagesRes.data||[];
  const groupesUniques=new Map();
  liensGroupage.forEach(x=>{
   if(!groupesUniques.has(x.group_id))groupesUniques.set(x.group_id,{id:x.group_id,group_reference:x.group_reference,transport_mode:x.transport_mode,transport_unit_reference:x.transport_unit_reference,transporter:x.transporter,origin:x.origin,destination:x.destination,load_date:x.load_date,status:x.group_status});
  });
  tousLesGroupages=Array.from(groupesUniques.values());
 }
 $('message').textContent=`${tousLesDossiers.length} dossier(s) chargé(s) · ${tousLesGroupages.length} groupage(s) · ${liensGroupage.length} ligne(s) fournisseur${groupageDisponible?'':' (groupages indisponibles)'}.`;
 $('lastUpdate').textContent='Actualisé le '+new Date().toLocaleString('fr-FR');
 appliquerFiltres();
}
$('recherche').addEventListener('input',appliquerFiltres);
$('filtreStatut').addEventListener('change',appliquerFiltres);
$('reinitialiser').addEventListener('click',()=>{$('recherche').value='';$('filtreStatut').value='';appliquerFiltres();});
charger();
</script>
</body>
</html>

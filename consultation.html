
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des importations — Consultation V2</title>

<style>
:root{
 --navy:#17365d;
 --navy-dark:#102846;
 --blue:#2563eb;
 --blue-light:#eff6ff;
 --purple:#7c3aed;
 --teal:#0f8b8d;
 --bg:#f4f7fc;
 --white:#ffffff;
 --ink:#263445;
 --muted:#68778b;
 --line:#dce4ef;
 --green:#16a34a;
 --orange:#ea8a16;
 --red:#dc2626;
 --shadow:0 5px 18px rgba(25,50,90,.07);
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--ink);
 line-height:1.5
}
.container{
 max-width:1450px;
 margin:auto;
 padding:26px 22px 48px
}

/* En-tête */
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 flex-wrap:wrap;
 background:linear-gradient(120deg,#17365d,#2456a6);
 color:white;
 padding:23px 25px;
 border-radius:15px;
 box-shadow:var(--shadow)
}
h1,h2,h3,h4{margin-top:0}
h1{
 font-size:28px;
 margin-bottom:5px;
 color:white;
 letter-spacing:.2px
}
header p{
 margin:0;
 color:#dbeafe;
 font-size:14px
}
#lastUpdate{
 font-size:12px;
 color:#e0eaff;
 background:#ffffff18;
 padding:9px 12px;
 border:1px solid #ffffff30;
 border-radius:8px
}

/* Message */
#message{
 padding:13px 16px;
 margin:17px 0;
 border-radius:10px;
 background:#eaf2ff;
 color:#1e457d;
 border-left:5px solid var(--blue);
 font-size:14px
}

/* Navigation par statut */
.status-nav{
 margin:23px 0 19px;
 padding:20px;
 background:white;
 border:1px solid var(--line);
 border-radius:14px;
 box-shadow:var(--shadow)
}
.status-nav h2{
 font-size:20px;
 margin:0 0 16px;
 color:var(--navy);
 border-left:5px solid var(--blue);
 padding:3px 0 3px 12px
}
.status-tabs{
 display:flex;
 gap:11px;
 flex-wrap:wrap
}
.status-tab{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:3px;
 border:1px solid #d8e2f0;
 background:#f8faff;
 color:#33445c;
 border-radius:10px;
 padding:13px 18px;
 min-height:48px;
 font-size:14px;
 font-weight:700;
 cursor:pointer;
 transition:background .18s,border-color .18s,transform .18s,box-shadow .18s
}
.status-tab:hover{
 border-color:#8eafea;
 background:#edf4ff;
 transform:translateY(-1px);
 box-shadow:0 3px 9px #1d4ed812
}
.status-tab.active{
 background:var(--navy);
 color:white;
 border-color:var(--navy);
 box-shadow:0 4px 10px #17365d30
}
.tab-count{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:26px;
 height:26px;
 padding:0 7px;
 margin-left:7px;
 border-radius:20px;
 background:#e2eaf8;
 color:#244fc1;
 font-size:13px;
 font-weight:800
}
.status-tab.active .tab-count{
 background:white;
 color:var(--navy)
}

/* Recherche */
.filters{
 display:flex;
 gap:11px;
 flex-wrap:wrap;
 margin:20px 0 24px
}
.filters input,.filters button{
 padding:12px 15px;
 border:1px solid #cbd5e1;
 border-radius:9px;
 font-size:14px;
 background:white;
 min-height:46px
}
.filters input{
 flex:1;
 min-width:230px;
 box-shadow:0 2px 6px #00000005
}
.filters input:focus{
 outline:none;
 border-color:var(--blue);
 box-shadow:0 0 0 3px #2563eb20
}
button{cursor:pointer}
.btn{
 background:var(--navy)!important;
 color:white!important;
 border:0!important;
 font-weight:700;
 padding-left:21px!important;
 padding-right:21px!important
}
.btn:hover{background:var(--blue)!important}

/* Liste */
.section{margin-top:27px}
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px
}
.section-head h2{
 font-size:22px;
 margin:0;
 color:var(--navy)
}
.count{
 font-size:13px;
 color:var(--muted)
}
.status-group{margin:0 0 27px}
.status-group-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:13px 16px;
 margin-bottom:13px;
 border-radius:10px;
 background:#e9f0fc;
 border-left:5px solid var(--blue)
}
.status-group-head h3{
 font-size:17px;
 margin:0;
 color:#1d477e
}
.cards{
 display:grid;
 grid-template-columns:1fr;
 gap:14px
}
.card{
 background:white;
 border:1px solid var(--line);
 border-radius:13px;
 padding:19px;
 box-shadow:var(--shadow);
 min-width:0;
 transition:box-shadow .2s,border-color .2s
}
.card:hover{
 border-color:#c4d5ef;
 box-shadow:0 7px 22px rgba(25,50,90,.10)
}
.card-title-line{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap
}
.card-title-line h3{
 margin:0;
 font-size:18px;
 color:var(--navy);
 overflow-wrap:anywhere
}

/* Badges de statut */
.status{
 display:inline-block;
 padding:7px 13px;
 border-radius:20px;
 font-size:12px;
 font-weight:800;
 white-space:nowrap;
 border:1px solid transparent
}
.status[data-status="Commandée"]{
 background:#e0e7ff;color:#3730a3;border-color:#c7d2fe
}
.status[data-status="En préparation"]{
 background:#ede9fe;color:#6d28d9;border-color:#ddd6fe
}
.status[data-status="Chargé"]{
 background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe
}
.status[data-status="En transit"]{
 background:#fef3c7;color:#92400e;border-color:#fde68a
}
.status[data-status="Arrivé au port"]{
 background:#cffafe;color:#155e75;border-color:#a5f3fc
}
.status[data-status="Dédouanement"]{
 background:#ffedd5;color:#9a3412;border-color:#fed7aa
}
.status[data-status="En livraison"]{
 background:#d1fae5;color:#065f46;border-color:#a7f3d0
}
.status[data-status="Livré"],
.status[data-status="Livrée"]{
 background:#dcfce7;color:#166534;border-color:#bbf7d0
}
.status[data-status="Bloqué"]{
 background:#fee2e2;color:#991b1b;border-color:#fecaca
}
.status[data-status="Annulée"]{
 background:#f1f5f9;color:#475569;border-color:#e2e8f0
}
.status[data-status="Non renseigné"]{
 background:#e5e7eb;color:#374151;border-color:#d1d5db
}

/* Informations transport */
.transport-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:11px;
 margin:17px 0
}
.transport-box{
 background:#f1f5fb;
 border-radius:9px;
 padding:13px;
 min-width:0;
 border-bottom:3px solid #4f83dc
}
.transport-box:nth-child(2){
 background:#f2efff;
 border-bottom-color:#8b65d1
}
.transport-box:nth-child(3){
 background:#eaf8f5;
 border-bottom-color:#36a58e
}
.transport-box strong{
 display:block;
 color:#68778b;
 font-size:12px;
 margin-bottom:6px;
 text-transform:uppercase;
 letter-spacing:.3px
}
.transport-box span{
 font-size:14px;
 font-weight:700;
 color:#263e5c;
 overflow-wrap:anywhere
}
.groupage-info{
 padding:12px 14px;
 background:#f1edff;
 border-radius:9px;
 font-size:13px;
 color:#51416e;
 margin:13px 0;
 border-left:4px solid var(--purple)
}
.groupage-info strong{color:#59369b}

/* Dossiers */
.group-members{
 margin-top:16px;
 padding-top:14px;
 border-top:1px solid var(--line)
}
.member{
 padding:15px;
 margin:12px 0;
 background:#f8faff;
 border:1px solid #dce5f5;
 border-left:4px solid #8b65d1;
 border-radius:10px;
 min-width:0
}
.member h4{
 margin:0 0 10px;
 font-size:16px;
 color:#6840a5;
 overflow-wrap:anywhere
}
.member p{font-size:13px;margin:7px 0}
.member-content{display:block}

/* Tableau articles */
.articles{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 min-width:450px
}
.articles th,.articles td{
 padding:10px;
 border-bottom:1px solid var(--line);
 text-align:left;
 font-size:13px
}
.articles th{
 background:#e5edff;
 color:#244fc1;
 font-weight:700
}
.articles tbody tr:nth-child(even){background:#f8faff}
.articles tbody tr:hover{background:#eef3ff}
.table-scroll{
 width:100%;
 overflow-x:auto;
 border-radius:8px;
 -webkit-overflow-scrolling:touch
}
.member .articles th{
 background:#eee8fa;
 color:#59369b
}
.empty{
 padding:25px;
 background:white;
 border:1px dashed #cbd5e1;
 border-radius:11px;
 color:var(--muted);
 text-align:center
}
.muted{color:var(--muted);font-size:13px}

/* Tablettes */
@media(min-width:701px) and (max-width:1050px){
 .container{padding:20px 16px 40px}
 .card{padding:16px}
 .transport-grid{gap:8px}
 .transport-box{padding:11px 9px}
 .transport-box span{font-size:13px}
 .status-tabs{gap:9px}
 .status-tab{padding:12px 14px;font-size:13px}
}

/* Mobiles */
@media(max-width:700px){
 .container{padding:15px 11px 32px}
 header{align-items:flex-start;padding:19px 16px}
 h1{font-size:23px}
 header p{font-size:13px}
 #lastUpdate{width:100%}
 #message{font-size:13px}
 .filters{gap:8px}
 .filters input,.filters button{
  width:100%;
  min-width:100%;
  flex:none
 }
 .status-nav{padding:15px}
 .status-nav h2{font-size:18px}
 .status-tabs{gap:8px}
 .status-tab{
  padding:11px 13px;
  font-size:13px;
  min-height:45px
 }
 .tab-count{min-width:24px;height:24px;font-size:12px}
 .section-head{align-items:flex-start;flex-direction:column}
 .section-head h2{font-size:19px}
 .status-group-head{padding:11px}
 .status-group-head h3{font-size:15px}
 .card{padding:13px}
 .card-title-line h3{font-size:16px}
 .transport-grid{gap:5px;margin:13px 0}
 .transport-box{padding:9px 6px}
 .transport-box strong{font-size:10px}
 .transport-box span{font-size:12px}
 .groupage-info{font-size:12px;padding:10px}
 .member{padding:10px;margin:9px 0}
 .member h4{font-size:14px}
 .member p{font-size:12px}
 .articles th,.articles td{padding:8px;font-size:12px}
}

/* Petits téléphones */
@media(max-width:390px){
 .container{padding-left:9px;padding-right:9px}
 h1{font-size:21px}
 .transport-grid{gap:4px}
 .transport-box{padding:8px 5px}
 .transport-box strong{font-size:9px}
 .transport-box span{font-size:11px}
 .status-tab{font-size:12px;padding:10px 11px;min-height:42px}
 .card-title-line h3{font-size:15px}
}
</style>
</head>

<body>
<div class="container">

<header>
 <div>
  <h1>Suivi des importations</h1>
  <p>Page de consultation — accès en lecture seule</p>
 </div>
 <div id="lastUpdate"></div>
</header>

<div id="message">Connexion à la base de données…</div>

<section class="status-nav">
 <h2>Suivi par statut</h2>
 <div id="statusTabs" class="status-tabs"></div>
</section>

<div class="filters">
 <input type="search" id="recherche"
  placeholder="Rechercher référence, fournisseur, camion, conteneur, BL, article…">
 <button type="button" class="btn" id="reinitialiser">Réinitialiser</button>
</div>

<section class="section">
 <div class="section-head">
  <h2 id="titreListe">Tous les chargements</h2>
  <span class="count" id="countChargements"></span>
 </div>
 <div id="chargements">
  <div class="empty">Chargement des chargements…</div>
 </div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Paramètres Supabase conservés */
const SUPABASE_URL='https://mnyokiniupvtzesdmwit.supabase.co';
const KEY='sb_publishable_-HIf7IptcZ1as_TXkn5SCQ_Fx6lPnbi';
const db=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);

let tousLesDossiers=[];
let lignesGroupage=[];
let groupesTransport=[];
let chargementsIndividuels=[];
let groupageDisponible=true;
let statutActif='';

const STATUTS_ORDRE=[
 'Commandée','En préparation','Chargé','En transit',
 'Arrivé au port','Dédouanement','En livraison',
 'Livré','Bloqué','Annulée','Non renseigné'
];

function safe(v){
 return String(v??'—').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function normaliser(v){
 return String(v??'').replace(/<br\s*\/?>/gi,' ')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .trim().toLowerCase();
}

function obtenirArticles(s){
 if(Array.isArray(s.articles)&&s.articles.length)return s.articles;

 if(s.article_names||s.articleNames||s.goods){
  return [{
   reference:s.article_reference||s.articleReference||'',
   name:s.article_names||s.articleNames||s.goods,
   quantity:s.quantity,unit:s.unit
  }];
 }
 return [];
}

function totalArticles(articles){
 const t={};
 articles.forEach(a=>{
  const u=a.unit||'Autre';
  if(a.quantity!==null&&a.quantity!==undefined&&a.quantity!==''){
   t[u]=(t[u]||0)+(Number(a.quantity)||0);
  }
 });
 return Object.entries(t)
  .map(([u,n])=>n.toLocaleString('fr-FR')+' '+u).join(' · ');
}

function statut(s){return s||'Non renseigné';}

function articlesHtml(s){
 const arts=obtenirArticles(s);
 if(!arts.length)return '<p class="muted">Aucun article détaillé.</p>';

 return `<div class="table-scroll">
 <table class="articles">
 <thead><tr><th>Référence</th><th>Désignation</th><th>Quantité</th><th>Unité</th></tr></thead>
 <tbody>${arts.map(a=>`
 <tr>
  <td>${safe(a.reference)}</td>
  <td style="white-space:pre-line">${safe(String(a.name||a.designation||'').replace(/<br\s*\/?>/gi,'\n'))}</td>
  <td>${safe(a.quantity)}</td>
  <td>${safe(a.unit)}</td>
 </tr>`).join('')}
 </tbody></table></div>
 <p><strong>Total :</strong> ${safe(totalArticles(arts)||'—')}</p>`;
}

function rechercherDansDossier(s){
 const arts=obtenirArticles(s);
 return normaliser([
  s.reference,s.ref,s.supplier,s.container,s.bl,s.invoice,
  s.goods,s.article_names,s.origin_port,s.dest_port,
  s.transporter,s.transport_unit_reference,
  ...arts.map(a=>[a.reference,a.name,a.designation,a.quantity,a.unit].join(' '))
 ].join(' '));
}

/* Construction des transports groupés */
function construireChargementsUnifies(){

 const dossiersParId=new Map();

 tousLesDossiers.forEach(s=>{
  const id=String(s.id??'');
  if(id)dossiersParId.set(id,{...s});
 });

 const groupesParId=new Map();
 const idsEnGroupage=new Set();

 lignesGroupage.forEach(m=>{
  const groupId=String(m.group_id??'');
  if(!groupId)return;

  if(!groupesParId.has(groupId)){
   groupesParId.set(groupId,{
    id:groupId,
    reference:m.group_reference,
    transport_mode:m.transport_mode,
    transport_unit_reference:m.transport_unit_reference,
    transporter:m.transporter,
    origin:m.origin,
    destination:m.destination,
    status:m.group_status||m.status||'Non renseigné',
    load_date:m.load_date,
    membres:[]
   });
  }

  const groupe=groupesParId.get(groupId);

  groupe.reference=groupe.reference||m.group_reference;
  groupe.transport_mode=groupe.transport_mode||m.transport_mode;
  groupe.transport_unit_reference=groupe.transport_unit_reference||m.transport_unit_reference;
  groupe.transporter=groupe.transporter||m.transporter;
  groupe.origin=groupe.origin||m.origin;
  groupe.destination=groupe.destination||m.destination;
  groupe.load_date=groupe.load_date||m.load_date;

  /* Le statut appartient au camion ou conteneur */
  groupe.status=m.group_status||m.status||groupe.status;

  const shipmentId=String(m.shipment_id??'');
  if(!shipmentId)return;

  idsEnGroupage.add(shipmentId);
  const base=dossiersParId.get(shipmentId)||{};

  /* Préserver les articles du dossier si la vue groupage est vide */
  const articlesGroupage=Array.isArray(m.articles)&&m.articles.length
   ?m.articles
   :base.articles;

  const membre={
   ...base,...m,
   id:shipmentId,
   reference:m.supplier_reference||base.reference||base.ref||m.reference,
   supplier:m.supplier||base.supplier,
   invoice:m.invoice||base.invoice,
   bl:m.bl||base.bl,
   articles:articlesGroupage,
   article_names:m.article_names||base.article_names,
   goods:m.goods||base.goods,
   quantity:m.quantity??base.quantity,
   unit:m.unit||base.unit
  };

  if(!groupe.membres.some(x=>String(x.id)===shipmentId)){
   groupe.membres.push(membre);
  }
 });

 groupesTransport=Array.from(groupesParId.values());

 chargementsIndividuels=tousLesDossiers.filter(s=>
  !idsEnGroupage.has(String(s.id??''))
 );
}

function rechercherDansGroupe(g){
 return normaliser([
  g.reference,g.transport_mode,g.transport_unit_reference,
  g.transporter,g.origin,g.destination,g.status,
  ...g.membres.map(rechercherDansDossier)
 ].join(' '));
}

/* Groupages : dossiers et articles toujours visibles */
function afficherGroupe(g){

 const mode=normaliser(g.transport_mode);
 const libelle=mode.includes('rout')?'N° camion':'N° conteneur';

 const membresHtml=g.membres.length
 ?g.membres.map((m,i)=>`
  <div class="member">
   <h4>Dossier ${i+1} — ${safe(m.reference||m.ref||'Sans référence')}</h4>
   <p><strong>Fournisseur :</strong> ${safe(m.supplier||'Non précisé')}</p>
   <p><strong>Facture :</strong> ${safe(m.invoice)} · <strong>BL :</strong> ${safe(m.bl)}</p>
   <p><strong>${obtenirArticles(m).length}</strong> article(s) ·
      ${safe(totalArticles(obtenirArticles(m))||'Total non renseigné')}</p>
   ${articlesHtml(m)}
  </div>`).join('')
 :'<p class="muted">Aucun dossier associé à ce transport.</p>';

 return `
 <article class="card">
  <div class="card-title-line">
   <h3>${safe(g.reference||'Groupage')}</h3>
   <span class="status" data-status="${safe(g.status)}">${safe(statut(g.status))}</span>
  </div>

  <div class="transport-grid">
   <div class="transport-box">
    <strong>${libelle}</strong>
    <span>${safe(g.transport_unit_reference)}</span>
   </div>
   <div class="transport-box">
    <strong>Destination</strong>
    <span>${safe(g.destination)}</span>
   </div>
   <div class="transport-box">
    <strong>Transporteur</strong>
    <span>${safe(g.transporter)}</span>
   </div>
  </div>

  <div class="groupage-info">
   <strong>Transport commun :</strong> ${safe(g.reference||'Groupage')}
   · <strong>${g.membres.length}</strong> dossier(s) associé(s)
  </div>

  <div class="group-members member-content">
   ${membresHtml}
  </div>
 </article>`;
}

/* Chargements individuels : articles toujours visibles */
function afficherIndividuel(s){

 const mode=normaliser(s.mode||s.transport_mode);
 const libelle=mode.includes('rout')?'N° camion':'N° conteneur';
 const numero=s.container||s.transport_unit_reference||
  s.truck_number||s.truck;

 const destination=s.destination||s.dest_port;

 return `
 <article class="card">
  <div class="card-title-line">
   <h3>${safe(s.reference||s.ref||'Chargement sans référence')}
    — ${safe(s.supplier||'Fournisseur non précisé')}</h3>
   <span class="status" data-status="${safe(s.status)}">${safe(statut(s.status))}</span>
  </div>

  <div class="transport-grid">
   <div class="transport-box">
    <strong>${libelle}</strong>
    <span>${safe(numero)}</span>
   </div>
   <div class="transport-box">
    <strong>Destination</strong>
    <span>${safe(destination)}</span>
   </div>
   <div class="transport-box">
    <strong>Transporteur</strong>
    <span>${safe(s.transporter)}</span>
   </div>
  </div>

  <p><strong>BL :</strong> ${safe(s.bl)}</p>
  <p><strong>${obtenirArticles(s).length}</strong> article(s) ·
   ${safe(totalArticles(obtenirArticles(s))||'Total non renseigné')}</p>
  ${articlesHtml(s)}
 </article>`;
}

/* Onglets de statut et compteurs */
function construireOngletsStatut(){

 const compteurs={};

 groupesTransport.forEach(g=>{
  const s=statut(g.status);
  compteurs[s]=(compteurs[s]||0)+1;
 });

 chargementsIndividuels.forEach(s=>{
  const nom=statut(s.status);
  compteurs[nom]=(compteurs[nom]||0)+1;
 });

 const noms=Object.keys(compteurs).sort((a,b)=>{
  const ia=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(a));
  const ib=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(b));
  return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'fr');
 });

 $('statusTabs').innerHTML=
  `<button class="status-tab ${!statutActif?'active':''}" data-status-filter="">
    Tous <span class="tab-count">${groupesTransport.length+chargementsIndividuels.length}</span>
   </button>`+
  noms.map(n=>`
   <button class="status-tab ${normaliser(statutActif)===normaliser(n)?'active':''}"
    data-status-filter="${safe(n)}">
    ${safe(n)} <span class="tab-count">${compteurs[n]}</span>
   </button>
  `).join('');
}

/* Affichage et filtres */
function appliquerFiltres(){

 const q=normaliser($('recherche').value);
 const st=normaliser(statutActif);

 const groupes=groupesTransport.filter(g=>{
  const rechercheOk=!q||rechercherDansGroupe(g).includes(q);
  const statutOk=!st||normaliser(g.status)===st;
  return rechercheOk&&statutOk;
 });

 const individuels=chargementsIndividuels.filter(s=>{
  const rechercheOk=!q||rechercherDansDossier(s).includes(q);
  const statutOk=!st||normaliser(s.status)===st;
  return rechercheOk&&statutOk;
 });

 const elements=[];

 groupes.forEach(g=>elements.push({
  status:statut(g.status),html:afficherGroupe(g)
 }));

 individuels.forEach(s=>elements.push({
  status:statut(s.status),html:afficherIndividuel(s)
 }));

 const parStatut=new Map();

 elements.forEach(e=>{
  if(!parStatut.has(e.status))parStatut.set(e.status,[]);
  parStatut.get(e.status).push(e);
 });

 const noms=Array.from(parStatut.keys()).sort((a,b)=>{
  const ia=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(a));
  const ib=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(b));
  return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'fr');
 });

 $('titreListe').textContent=st
  ?'Chargements — '+statutActif
  :'Tous les chargements';

 $('countChargements').textContent=
  groupes.length+' transport(s) groupé(s) · '+
  individuels.length+' chargement(s) individuel(s)';

 if(!elements.length){
  $('chargements').innerHTML=
   '<div class="empty">Aucun chargement ne correspond à votre recherche.</div>';
  return;
 }

 $('chargements').innerHTML=noms.map(nom=>{
  const liste=parStatut.get(nom);
  return `
   <section class="status-group">
    <div class="status-group-head">
     <h3>${safe(nom)}</h3>
     <span class="count">${liste.length} transport(s) / chargement(s)</span>
    </div>
    <div class="cards">${liste.map(e=>e.html).join('')}</div>
   </section>`;
 }).join('');
}

/* Lecture des vues Supabase */
async function charger(){

 $('message').textContent='Chargement des importations depuis Supabase…';

 const dossiersRes=await db
  .from('shipment_consultation_public')
  .select('*');

 if(dossiersRes.error){
  $('message').textContent=
   'Erreur de lecture des chargements : '+dossiersRes.error.message;
  return;
 }

 tousLesDossiers=dossiersRes.data||[];

 const groupagesRes=await db
  .from('groupages_consultation_public')
  .select('*')
  .order('load_date',{ascending:false});

 if(groupagesRes.error){
  console.error('Erreur de lecture des groupages',groupagesRes.error);
  groupageDisponible=false;
  lignesGroupage=[];
 }else{
  groupageDisponible=true;
  lignesGroupage=groupagesRes.data||[];
 }

 construireChargementsUnifies();
 construireOngletsStatut();

 $('message').textContent=
  groupesTransport.length+' transport(s) groupé(s) · '+
  chargementsIndividuels.length+' chargement(s) individuel(s)'+
  (groupageDisponible?'':' · Informations des groupages indisponibles.');

 $('lastUpdate').textContent=
  'Actualisé le '+new Date().toLocaleString('fr-FR');

 appliquerFiltres();
}

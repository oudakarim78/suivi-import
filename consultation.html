<script>
/* Paramètres Supabase conservés tels quels */
const SUPABASE_URL='https://mnyokiniupvtzesdmwit.supabase.co';
const KEY='sb_publishable_-HIf7IptcZ1as_TXkn5SCQ_Fx6lPnbi';

const db=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);

let tousLesDossiers=[];
let lignesGroupage=[];
let chargementsUnifies=[];
let statutActif='';
let typeActif='';
let groupageDisponible=true;

const STATUTS_ORDRE=[
  'Commandée',
  'En préparation',
  'Chargé',
  'En transit',
  'Arrivé au port',
  'Dédouanement',
  'En livraison',
  'Livré',
  'Bloqué',
  'Annulée'
];

function safe(v){
  return String(v??'—').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function normaliser(v){
  return String(v??'')
    .replace(/<br\s*\/?>/gi,' ')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .trim()
    .toLowerCase();
}

function estLivre(s){
  const st=normaliser(s.status);
  return st==='livre'||st==='livree';
}

function obtenirArticles(s){
  if(Array.isArray(s.articles)&&s.articles.length){
    return s.articles;
  }

  if(s.article_names||s.articleNames||s.goods){
    return [{
      reference:s.article_reference||s.articleReference||'',
      name:s.article_names||s.articleNames||s.goods,
      quantity:s.quantity,
      unit:s.unit
    }];
  }

  return [];
}

function totalArticles(articles){
  const totaux={};

  articles.forEach(a=>{
    const unite=a.unit||'Autre';

    if(a.quantity!==null&&a.quantity!==undefined&&a.quantity!==''){
      totaux[unite]=(totaux[unite]||0)+(Number(a.quantity)||0);
    }
  });

  return Object.entries(totaux)
    .map(([u,n])=>n.toLocaleString('fr-FR')+' '+u)
    .join(' · ');
}

function statut(s){
  return s||'Non renseigné';
}

function articlesHtml(s){
  const arts=obtenirArticles(s);

  if(!arts.length){
    return '<div class="article-empty">Aucun article détaillé disponible pour ce chargement.</div>';
  }

  const lignes=arts.map(a=>`
    <tr>
      <td data-label="Référence">${safe(a.reference||'—')}</td>
      <td data-label="Désignation" style="white-space:pre-line">${safe(String(a.name||a.designation||'').replace(/<br\s*\/?>/gi,'\n'))}</td>
      <td data-label="Quantité">${safe(a.quantity??'—')}</td>
      <td data-label="Unité">${safe(a.unit||'—')}</td>
    </tr>
  `).join('');

  return `
    <table class="articles">
      <thead>
        <tr>
          <th>Référence</th>
          <th>Désignation</th>
          <th>Quantité</th>
          <th>Unité</th>
        </tr>
      </thead>
      <tbody>${lignes}</tbody>
    </table>
    <div class="total-articles">
      Total : ${safe(totalArticles(arts)||'Non renseigné')}
    </div>
  `;
}

function rechercherDansChargement(s){
  const arts=obtenirArticles(s);
  const grp=s._groupage||{};

  return normaliser([
    s.reference,
    s.ref,
    s.supplier,
    s.container,
    s.bl,
    s.status,
    s.goods,
    s.article_names,
    s.dest_port,
    s.destination,
    s.transporter,
    s.group_reference,
    s.transport_mode,
    s.transport_unit_reference,
    grp.group_reference,
    grp.transport_unit_reference,
    grp.transporter,
    ...arts.map(a=>[
      a.reference,
      a.name,
      a.designation,
      a.quantity,
      a.unit
    ].join(' '))
  ].join(' '));
}

function construireChargementsUnifies(){
  const parId=new Map();

  tousLesDossiers.forEach(s=>{
    const id=String(s.id??s.reference??s.ref??'');

    if(id){
      parId.set(id,{...s,_groupage:null});
    }
  });

  lignesGroupage.forEach(m=>{
    const id=String(m.shipment_id??m.id??'');

    if(!id)return;

    const base=parId.get(id)||{};

    const rattachement={
      group_id:m.group_id,
      group_reference:m.group_reference,
      transport_mode:m.transport_mode,
      transport_unit_reference:m.transport_unit_reference,
      transporter:m.transporter,
      origin:m.origin,
      destination:m.destination,
      group_status:m.group_status,
      load_date:m.load_date
    };

    const membre={
      ...base,
      ...m,

      id:m.shipment_id||base.id||m.id,

      reference:m.supplier_reference||m.reference||base.reference||base.ref,

      status:m.supplier_status||m.status||base.status||'Non renseigné',

      supplier:m.supplier||base.supplier,
      invoice:m.invoice||base.invoice,
      container:m.container||base.container,
      bl:m.bl||base.bl,

      articles:Array.isArray(m.articles)&&m.articles.length
        ?m.articles
        :base.articles,

      article_names:m.article_names||base.article_names,
      goods:m.goods||base.goods,
      quantity:m.quantity??base.quantity,
      unit:m.unit||base.unit,

      _groupage:rattachement
    };

    parId.set(id,membre);
  });

  chargementsUnifies=Array.from(parId.values());
}

function info(label,value){
  if(value===null||value===undefined||String(value).trim()===''){
    return '';
  }

  return `
    <div class="info-box">
      <div class="info-label">${safe(label)}</div>
      <div class="info-value">${safe(value)}</div>
    </div>
  `;
}

function afficherChargement(s){
  const arts=obtenirArticles(s);
  const grp=s._groupage;
  const reference=s.reference||s.ref||'Chargement sans référence';

  const mode=String(s.transport_mode||grp?.transport_mode||'').toLowerCase();
  const routier=mode.includes('rout');

  let numeroTransport='';
  let labelTransport='N° de transport';

  if(routier){
    numeroTransport=
      grp?.transport_unit_reference||
      s.transport_unit_reference||
      s.truck_number||
      s.truck||
      s.container||
      '';

    labelTransport='N° camion';
  }else{
    numeroTransport=
      s.container||
      s.transport_unit_reference||
      grp?.transport_unit_reference||
      '';

    labelTransport='N° conteneur';
  }

  const destination=s.dest_port||s.destination||grp?.destination||'';

  const typeHtml=grp
    ?'<span class="type-tag group">CHARGEMENT EN GROUPAGE</span>'
    :'<span class="type-tag">CHARGEMENT INDIVIDUEL</span>';

  const groupDetails=grp?`
    <div class="groupage-info">
      <strong>Groupage :</strong>
      ${safe(grp.group_reference||'Référence non renseignée')}
      ${grp.transport_mode?' · '+safe(grp.transport_mode):''}
      ${grp.transporter?' · Transporteur : '+safe(grp.transporter):''}
    </div>
  `:'';

  const transportHtml=`
    <div class="transport-destination">

      <div class="transport-box">
        <div class="transport-label">${safe(labelTransport)}</div>
        <div class="transport-value">${safe(numeroTransport)}</div>
      </div>

      <div class="transport-box destination-box">
        <div class="transport-label">Destination</div>
        <div class="transport-value">${safe(destination)}</div>
      </div>

    </div>
  `;

  return `
    <article class="card">

      <div class="card-title-line">
        <div>
          <div class="reference">${safe(reference)}</div>
          <span class="supplier">${safe(s.supplier||'Fournisseur non précisé')}</span>
          ${typeHtml}
        </div>

        <span class="status" data-status="${safe(statut(s.status))}">
          ${safe(statut(s.status))}
        </span>
      </div>

      ${transportHtml}

      <div class="infos">
        ${info('N° BL',s.bl)}
        ${info('Mode de transport',s.transport_mode||grp?.transport_mode)}
        ${info('Transitaire / Transporteur',s.transporter||grp?.transporter)}
      </div>

      ${groupDetails}

      <div class="articles-title">
        <strong>Articles du chargement</strong>
        <span class="articles-count">${arts.length} article(s)</span>
      </div>

      ${articlesHtml(s)}

    </article>
  `;
}

/* Statistiques et cartes interactives */
function mettreAJourStatistiques(){
  $('statIndividuels').textContent=
    chargementsUnifies.filter(s=>!s._groupage).length;

  $('statGroupages').textContent=
    chargementsUnifies.filter(s=>!!s._groupage).length;

  $('statLivres').textContent=
    chargementsUnifies.filter(estLivre).length;

  $('carteIndividuels').classList.toggle(
    'active',typeActif==='individuel'
  );

  $('carteGroupages').classList.toggle(
    'active',typeActif==='groupage'
  );

  $('carteLivres').classList.toggle(
    'active',typeActif==='livre'
  );
}

function listeFiltree(){
  const q=normaliser($('recherche').value);

  return chargementsUnifies.filter(s=>{
    const rechercheOk=!q||rechercherDansChargement(s).includes(q);

    const statutOk=
      !statutActif||
      normaliser(s.status)===normaliser(statutActif);

    let typeOk=true;

    if(typeActif==='individuel'){
      typeOk=!s._groupage;
    }else if(typeActif==='groupage'){
      typeOk=!!s._groupage;
    }else if(typeActif==='livre'){
      typeOk=estLivre(s);
    }

    return rechercheOk&&statutOk&&typeOk;
  });
}

function afficherOnglets(){
  const compte={};

  chargementsUnifies.forEach(s=>{
    const nom=statut(s.status);
    compte[nom]=(compte[nom]||0)+1;
  });

  const noms=Object.keys(compte).sort((a,b)=>{
    const ia=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(a));
    const ib=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(b));

    return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'fr');
  });

  const onglets=[
    `<button class="tab ${statutActif===''?'active':''}" data-statut="">
      Tous <span class="tab-count">${chargementsUnifies.length}</span>
    </button>`
  ];

  noms.forEach(nom=>{
    onglets.push(`
      <button class="tab ${normaliser(statutActif)===normaliser(nom)?'active':''}" data-statut="${safe(nom)}">
        ${safe(nom)}
        <span class="tab-count">${compte[nom]}</span>
      </button>
    `);
  });

  $('statusTabs').innerHTML=onglets.join('');

  $('statusTabs').querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      statutActif=btn.dataset.statut||'';
      afficherOnglets();
      appliquerFiltres();
    });
  });
}

function appliquerFiltres(){
  const filtres=listeFiltree();

  let titre='Tous les chargements';

  if(typeActif==='individuel'){
    titre='Chargements individuels';
  }else if(typeActif==='groupage'){
    titre='Chargements en groupage';
  }else if(typeActif==='livre'){
    titre='Chargements livrés';
  }

  if(statutActif){
    titre+=' — '+statutActif;
  }

  $('titreResultats').textContent=titre;

  $('countChargements').textContent=
    filtres.length+' chargement(s)';

  if(!filtres.length){
    $('chargements').innerHTML=`
      <div class="empty">
        Aucun chargement ne correspond à votre recherche.
        <br>Essayez un autre filtre ou un autre mot-clé.
      </div>
    `;
    return;
  }

  const groupesStatut=new Map();

  filtres.forEach(s=>{
    const nom=statut(s.status);

    if(!groupesStatut.has(nom)){
      groupesStatut.set(nom,[]);
    }

    groupesStatut.get(nom).push(s);
  });

  const noms=Array.from(groupesStatut.keys()).sort((a,b)=>{
    const ia=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(a));
    const ib=STATUTS_ORDRE.findIndex(x=>normaliser(x)===normaliser(b));

    return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'fr');
  });

  $('chargements').innerHTML=noms.map(nom=>{
    const liste=groupesStatut.get(nom);

    return `
      <section class="status-group">
        <div class="status-group-head">
          <h3>${safe(nom)}</h3>
          <span class="count">${liste.length} chargement(s)</span>
        </div>

        <div class="status-cards">
          ${liste.map(afficherChargement).join('')}
        </div>
      </section>
    `;
  }).join('');
}

/* Actions des trois cartes */
function activerType(type){
  typeActif=typeActif===type?'':type;

  statutActif='';

  afficherOnglets();
  mettreAJourStatistiques();
  appliquerFiltres();
}

$('carteIndividuels').addEventListener('click',()=>{
  activerType('individuel');
});

$('carteGroupages').addEventListener('click',()=>{
  activerType('groupage');
});

$('carteLivres').addEventListener('click',()=>{
  activerType('livre');
});

async function charger(){
  $('message').textContent=
    'Chargement des importations depuis Supabase…';

  try{
    const dossiersRes=await db
      .from('shipment_consultation_public')
      .select('*');

    if(dossiersRes.error){
      $('message').textContent=
        'Erreur de lecture des chargements : '+dossiersRes.error.message;
      return;
    }

    tousLesDossiers=dossiersRes.data||[];

    const groupagesRes=await db
      .from('groupages_consultation_public')
      .select('*')
      .order('load_date',{ascending:false});

    if(groupagesRes.error){
      console.error('Erreur de lecture des groupages',groupagesRes.error);
      groupageDisponible=false;
      lignesGroupage=[];
    }else{
      groupageDisponible=true;
      lignesGroupage=groupagesRes.data||[];
    }

    construireChargementsUnifies();

    mettreAJourStatistiques();
    afficherOnglets();

    $('message').textContent=
      chargementsUnifies.length+' chargement(s) affiché(s) · '+
      chargementsUnifies.filter(s=>s._groupage).length+
      ' en groupage · '+
      chargementsUnifies.filter(s=>!s._groupage).length+
      ' individuel(s)'+
      (groupageDisponible?'':' · Informations de groupage temporairement indisponibles.');

    $('lastUpdate').textContent=
      'Actualisé le '+new Date().toLocaleString('fr-FR');

    appliquerFiltres();

  }catch(error){
    console.error(error);

    $('message').textContent=
      'Erreur de connexion à Supabase : '+error.message;
  }
}

$('recherche').addEventListener('input',appliquerFiltres);

$('reinitialiser').addEventListener('click',()=>{
  $('recherche').value='';
  statutActif='';
  typeActif='';
  afficherOnglets();
  mettreAJourStatistiques();
  appliquerFiltres();
});

charger();
</script>
</body>
</html>

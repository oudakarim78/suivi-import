
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation des importations</title>

<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f9;color:#263445}
h2{color:#17365d}
.container{max-width:1200px;margin:auto}
.table-wrap{overflow-x:auto;background:white;border-radius:10px;padding:12px}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#17365d;color:white}
tr:hover{background:#f1f5fa}
#message{padding:12px;margin:12px 0}
  .filtres {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.filtres input,
.filtres select,
.filtres button {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.filtres input {
  flex: 2;
  min-width: 220px;
}

.filtres select {
  flex: 1;
  min-width: 180px;
}

.filtres button {
  background: #17365d;
  color: white;
  cursor: pointer;
}
  /* Cartes des dossiers */
#dossiers {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.dossier-card {
  background: white;
  border: 1px solid #dce3ec;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

.dossier-card h3 {
  color: #17365d;
  margin: 0 0 12px;
}

.dossier-infos {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 24px;
  margin-bottom: 14px;
}

.statut-dossier {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #e8eef7;
  color: #17365d;
  font-weight: bold;
}

.btn-articles {
  background: #17365d;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 10px 16px;
  cursor: pointer;
}

.modal-articles {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal-contenu {
  background: white;
  width: 100%;
  max-width: 750px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 12px;
  padding: 22px;
}

.modal-contenu table {
  width: 100%;
  min-width: 0;
  border-collapse: collapse;
}

.modal-contenu th,
.modal-contenu td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.btn-fermer {
  float: right;
  border: 0;
  background: #17365d;
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .dossier-infos {
    flex-direction: column;
    gap: 8px;
  }
}
  /* Filtres horizontaux */
.filtres {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 10px;
  margin: 15px 0;
}

.filtres input {
  flex: 2 1 350px;
  min-width: 0;
  max-width: 350px;
  padding: 9px 12px;
}

.filtres select {
  flex: 1 1 220px;
  min-width: 170px;
  max-width: 220px;
  padding: 9px 12px;
}

.filtres button {
  padding: 9px 14px;
  white-space: nowrap;
}

@media (max-width: 600px) {
  .filtres {
    flex-wrap: wrap;
  }

  .filtres input,
  .filtres select {
    flex: 1 1 100%;
    max-width: 100%;
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="container">
<h2>Suivi des importations</h2>
<p>Page de consultation — accès en lecture seule</p>
<div id="message">Chargement des dossiers...</div>
  <div class="filtres">
  <input
    type="search"
    id="recherche"
    placeholder="Rechercher fournisseur, conteneur, BL, article..."
  >

<select id="filtreStatut">
    <option value="">Tous les statuts</option>
    <option value="Commandée">Commandée</option>
    <option value="En préparation">En préparation</option>
    <option value="Chargé">Chargé</option>
    <option value="En transit">En transit</option>
    <option value="Arrivé au port">Arrivé au port</option>
    <option value="Dédouanement">Dédouanement</option>
    <option value="En livraison">En livraison</option>
    <option value="Livré">Livré</option>
    <option value="Bloqué">Bloqué</option>
    <option value="Annulée">Annulée</option>
</select>

  <button type="button" id="reinitialiser">Réinitialiser</button>
    </div>
<div id="dossiers"></div>
    <div id="modalArticles" class="modal-articles">
  <div class="modal-contenu">
    <button type="button" class="btn-fermer" onclick="fermerArticles()">Fermer ✕</button>
    <h2 id="titreModal">Articles du dossier</h2>
    <div id="contenuArticles"></div>
  </div>
</div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mnyokiniupvtzesdmwit.supabase.co';
const KEY = 'sb_publishable_-HIf7IptcZ1as_TXkn5SCQ_Fx6lPnbi';

const db = window.supabase.createClient(SUPABASE_URL, KEY);

function safe(value) {
  return String(value ?? '—').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}
let tousLesDossiers = [];

function normaliser(valeur) {
  return String(valeur ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();
}

function obtenirArticles(s) {
  if (Array.isArray(s.articles) && s.articles.length) {
    return s.articles;
  }

  if (s.article_names) {
    return [{
      reference: '',
      name: s.article_names,
      quantity: s.quantity,
      unit: s.unit
    }];
  }

  return [];
}

function calculerTotaux(articles) {
  const totaux = {};

  articles.forEach(a => {
    const unite = a.unit || 'Autre';
    totaux[unite] = (totaux[unite] || 0) +
      (Number(a.quantity) || 0);
  });

  return Object.entries(totaux)
    .map(([unite, total]) =>
      total.toLocaleString('fr-FR') + ' ' + unite
    )
    .join(' · ');
}


function ouvrirArticles(index) {
  const dossier = tousLesDossiers[index];
  if (!dossier) return;

  const articles = obtenirArticles(dossier);

  document.getElementById('titreModal').textContent =
    'Articles du dossier — ' + (dossier.supplier || 'Sans fournisseur');

  const lignes = articles.map(a => `
    <tr>
      <td>${safe(a.reference || '')}</td>
      <td>${safe(a.name || '')}</td>
      <td>${safe(a.quantity ?? '')}</td>
      <td>${safe(a.unit || '')}</td>
      <td>${safe(a.availability || 'Non renseigné')}</td>
      <td>${safe(a.availableQuantity ?? 'Non renseigné')}</td>
      <td>${safe(a.expectedAvailabilityDate || 'Non renseignée')}</td>
      <td>${safe(a.supplierComment || 'Aucun commentaire')}</td>
    </tr>
  `).join('');

  document.getElementById('contenuArticles').innerHTML = `
    <p><strong>Fournisseur :</strong> ${safe(dossier.supplier)}</p>
    <p><strong>Conteneur :</strong> ${safe(dossier.container)}</p>
    <p><strong>BL :</strong> ${safe(dossier.bl)}</p>
    <p><strong>Arrivée prévue :</strong> ${safe(dossier.eta)}</p>
    <p><strong>Statut :</strong> ${safe(dossier.status)}</p>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Référence</th>
            <th>Désignation</th>
            <th>Quantité commandée</th>
            <th>Unité</th>
            <th>Disponibilité</th>
            <th>Quantité disponible</th>
            <th>Date de disponibilité</th>
            <th>Commentaire fournisseur</th>
          </tr>
        </thead>
        <tbody>
          ${lignes || '<tr><td colspan="8">Aucun article enregistré.</td></tr>'}
        </tbody>
      </table>
    </div>

    <p class="total-dossier">
      Total : ${safe(calculerTotaux(articles) || 'Aucun article')}
    </p>
  `;

  document.getElementById('modalArticles').style.display = 'flex';
}

  document.getElementById('modalArticles').style.display = 'none';
}

function appliquerFiltres() {
  const recherche = normaliser(
    document.getElementById('recherche').value
  );

  const statut = normaliser(
    document.getElementById('filtreStatut').value
  );

  const dossiersFiltres = tousLesDossiers
    .map((dossier, index) => ({ dossier, index }))
    .filter(({ dossier }) => {
      const articles = obtenirArticles(dossier);

      const texte = normaliser([
        dossier.supplier,
        dossier.container,
        dossier.bl,
        dossier.eta,
        dossier.status,
        ...articles.map(a =>
          [a.reference, a.name, a.quantity, a.unit].join(' ')
        )
      ].join(' '));

      const correspondRecherche = texte.includes(recherche);
      const correspondStatut =
        !statut || normaliser(dossier.status) === statut;

      return correspondRecherche && correspondStatut;
    });

  afficherDossiers(dossiersFiltres);
}

function afficherDossiers(liste) {
  const zone = document.getElementById('dossiers');

  if (!liste.length) {
    zone.innerHTML = '<p>Aucun dossier ne correspond à votre recherche.</p>';
    return;
  }

  zone.innerHTML = liste.map(({ dossier: s, index }) => {
    const articles = obtenirArticles(s);
    const total = calculerTotaux(articles);

    return `
      <div class="dossier-card">
        <h3>Dossier ${index + 1} — ${safe(s.supplier)}</h3>

        <div class="dossier-infos">
          <span><strong>Conteneur :</strong> ${safe(s.container)}</span>
          <span><strong>BL :</strong> ${safe(s.bl)}</span>
          <span><strong>Arrivée prévue :</strong> ${safe(s.eta)}</span>
          <span class="statut-dossier">${safe(s.status)}</span>
        </div>

        <p>
          <strong>${articles.length}</strong>
          article(s) enregistré(s)
          ${total ? ' · ' + safe(total) : ''}
        </p>

        <button
          type="button"
          class="btn-articles"
          onclick="ouvrirArticles(${index})">
          Voir les articles
        </button>
      </div>
    `;
  }).join('');
}

async function chargerDossiers() {
  const message = document.getElementById('message');

  message.textContent = 'Chargement des dossiers...';

  const { data, error } = await db
    .from('shipments_public')
    .select('supplier,container,bl,article_names,quantity,unit,eta,status,articles')
    .order('eta', { ascending: true });

  if (error) {
    message.textContent = 'Erreur de chargement : ' + error.message;
    return;
  }

  tousLesDossiers = data || [];

  if (!tousLesDossiers.length) {
    message.textContent = 'Aucun dossier disponible.';
    document.getElementById('dossiers').innerHTML = '';
    return;
  }

  message.textContent =
    tousLesDossiers.length + ' dossier(s) disponible(s).';

  appliquerFiltres();
}
document.getElementById('recherche').addEventListener('input', appliquerFiltres);

document.getElementById('filtreStatut').addEventListener('change', appliquerFiltres);

document.getElementById('reinitialiser').addEventListener('click', () => {
  document.getElementById('recherche').value = '';
  document.getElementById('filtreStatut').value = '';
  appliquerFiltres();
});
chargerDossiers();
</script>
</body>
</html>

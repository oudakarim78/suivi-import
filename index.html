let currentUser=null,profile=null,page='dashboard',rows=[],editing=null,tripStatusFilter=null,lookups={vehicles:[],drivers:[],clients:[],trips:[]},cityCatalog=[];
const ROLE_NAMES={admin:'Administration',logistique:'Logistique',comptable:'Comptabilité',conducteur:'Conducteur'};
const STATUS=['À planifier','En cours','Terminée','Annulée'];
const CONFIG={
 vehicles:{title:'Véhicules',table:'vehicles',roles:['admin','logistique'],fields:[['registration','Immatriculation','text',true],['vehicle_type','Type de véhicule','text'],['brand','Marque','text'],['model','Modèle','text'],['year','Année','number'],['status','Statut','select',['actif','en_maintenance','inactif']]]},
 drivers:{title:'Conducteurs',table:'drivers',roles:['admin','logistique'],fields:[['full_name','Nom complet','text',true],['phone','Téléphone','tel'],['email','E-mail','email'],['license_number','N° permis','text'],['status','Statut','select',['actif','inactif']]]},
 clients:{title:'Clients',table:'clients',roles:['admin','logistique'],fields:[['company_name','Raison sociale','text',true],['contact_name','Nom du contact','text'],['phone','Téléphone','tel'],['email','E-mail','email'],['address','Adresse','textarea'],['ice','ICE','text'],['client_type','Type de client','text'],['active','Client actif','select',['true','false']]]},
 trips:{title:'Missions',table:'trips',roles:['admin','logistique'],fields:[]},
 expenses:{title:'Dépenses',table:'expenses',roles:['admin','comptable'],fields:[['trip_id','Mission concernée','lookup:trips',true],['expense_type','Type de dépense','text',true],['amount','Montant','number',true],['currency','Devise','select',['MAD','EUR']],['expense_date','Date','date'],['description','Description','textarea']]},
 maintenance:{title:'Maintenance',table:'maintenance',roles:['admin','logistique'],fields:[['vehicle_id','Véhicule','lookup:vehicles'],['maintenance_type','Type d’entretien','text',true],['description','Description','textarea'],['maintenance_date','Date entretien','date'],['cost','Coût','number'],['currency','Devise','select',['MAD','EUR']],['next_maintenance_date','Prochaine échéance','date']]},
 documents:{title:'Documents & médias',table:'documents',roles:['admin','logistique'],fields:[['trip_id','Mission','lookup:trips',true],['document_type','Type','select',['Document','Photo','Signature']],['document_name','Nom','text',true],['expiry_date','Date d’expiration','date']]}
};
function can(roleList){return roleList.includes(profile?.role)}
function escapeHtml(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(target,message){$(target).innerHTML='<div class="error"></div>';$(target).firstChild.textContent=message}
function notify(message){alert(message)}
function dateText(v){if(!v)return '—';try{return new Date(v+'T00:00:00').toLocaleDateString('fr-FR')}catch{return v}}
function money(v,c='MAD'){return Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+c}

function navItems(){
  let list=[];

  if(profile.role!=='conducteur')
    list.push(['dashboard','Tableau de bord']);

  if(can(['admin','logistique','comptable']))
    list.push(['trips','Missions']);

  if(can(['admin','logistique','comptable']))
    list.push(
      ['vehicles','Véhicules'],
      ['drivers','Conducteurs'],
      ['clients','Clients']
    );

  if(can(['admin','comptable']))
    list.push(
      ['employees','Personnel'],
      ['payroll','Paie'],
      ['expenses','Dépenses & rentabilité']
    );

  if(can(['admin','logistique']))
    list.push(
      ['maintenance','Maintenance'],
      ['documents','Documents & médias']
    );
  else if(profile.role==='comptable')
    list.push(
      ['maintenance','Maintenance'],
      ['documents','Documents & médias']
    );

  if(profile.role==='conducteur')
    list.push(
      ['driver','Mes missions'],
      ['proposal','Proposer un client']
    );

  if(can(['admin','comptable','logistique']))
    list.push(['invoices','Facturation']);

  if(can(['admin','logistique']))
    list.push(['gps','Suivi GPS']);

  if(profile.role==='admin')
    list.push(
      ['proposals','Validation clients'],
      ['users','Utilisateurs'],
      ['audit','Journal des actions'],
      ['company','Paramètres de l’entreprise'],
      ['cities','Pays et villes']
    );

  return list;
}

function renderNav(){const nav=$('nav');nav.innerHTML='';navItems().forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=id;if(page===id)b.classList.add('active');b.onclick=()=>go(id);nav.append(b)})}
async function loadProfile(user){const q=await db.from('profiles').select('role,active,full_name,driver_id').eq('id',user.id).maybeSingle();if(q.error)throw q.error;if(!q.data||!q.data.active)throw Error('Profil absent ou inactif. Vérifiez la table profiles.');if(!['admin','logistique','comptable','conducteur'].includes(q.data.role))throw Error('Rôle utilisateur non reconnu.');return q.data}
async function enter(user){currentUser=user;profile=await loadProfile(user);$('login').hidden=true;$('app').hidden=false;$('userbar').hidden=false;$('who').textContent=(profile.full_name||user.email)+' · '+ROLE_NAMES[profile.role];await refreshLookups();renderNav();await go(profile.role==='conducteur'?'driver':'dashboard')}
async function signIn(){ $('loginerror').innerHTML='';$('signin').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await enter(r.data.user)}catch(e){showError('loginerror',e.message||String(e));await db.auth.signOut()}finally{$('signin').disabled=false}}
$('signin').onclick=signIn;$('password').onkeydown=e=>{if(e.key==='Enter')signIn()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
db.auth.getSession().then(async r=>{if(r.data.session){try{await enter(r.data.session.user)}catch(e){await db.auth.signOut();showError('loginerror',e.message)}}});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&$('app'))location.reload()});
async function refreshLookups(){const tables=['vehicles','drivers','clients','trips'];for(const t of tables){let q=await db.from(t).select(t==='trips'?'id,reference,departure,destination,status':'id,'+(t==='vehicles'?'registration':t==='drivers'?'full_name':'company_name')).limit(500);if(!q.error)lookups[t]=q.data||[]}}

async function companyPage() {
  $('toolbar').innerHTML = '';

  $('content').innerHTML = `
    <div class="panel">
      <h2>Paramètres de l’entreprise</h2>

      <form id="companyForm">
        <div class="grid">
          <label>Raison sociale
            <input name="company_name" required>
          </label>

          <label>Activité
            <input name="activity">
          </label>

          <label>Téléphone
            <input name="phone">
          </label>

          <label>Email
            <input name="email" type="email">
          </label>

          <label>Adresse
            <input name="address">
          </label>

          <label>Ville
            <input name="city">
          </label>

          <label>ICE
            <input name="ice">
          </label>

          <label>Identifiant fiscal (IF)
            <input name="tax_id">
          </label>

          <label>Registre de commerce (RC)
            <input name="rc">
          </label>

          <label>Taxe professionnelle (TP)
            <input name="tp">
          </label>

          <label>Banque
            <input name="bank">
          </label>

          <label>RIB / IBAN
            <input name="rib">
          </label>

          <label>Logo de l’entreprise
            <input type="file" id="companyLogoFile"
              accept="image/png,image/jpeg,image/webp">
          </label>

          <input type="hidden" name="logo_url">

          <div style="margin:10px 0">
            <p>Aperçu du logo :</p>
            <img id="companyLogoPreview"
              alt="Aperçu du logo"
              style="display:none;max-width:180px;max-height:100px;object-fit:contain;border:1px solid #ddd;padding:6px;border-radius:6px">
          </div>

          <label>Conditions de paiement
            <textarea name="payment_terms"></textarea>
          </label>
        </div>

        <button type="submit">Enregistrer les informations</button>
      </form>

      <p id="companyMessage"></p>
    </div>
  `;

  const form = $('companyForm');
  const message = $('companyMessage');
  const logoFile = $('companyLogoFile');
  const logoPreview = $('companyLogoPreview');
  const logoField = form.elements.logo_url;

  function showLogo(src) {
    if (src) {
      logoPreview.src = src;
      logoPreview.style.display = 'block';
    } else {
      logoPreview.removeAttribute('src');
      logoPreview.style.display = 'none';
    }
  }

  logoFile.onchange = () => {
    const file = logoFile.files[0];
    if (!file) return;

    if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
      message.textContent = 'Format accepté : PNG, JPG ou WEBP.';
      logoFile.value = '';
      return;
    }

    if (file.size > 1024 * 1024) {
      message.textContent = 'Le logo ne doit pas dépasser 1 Mo.';
      logoFile.value = '';
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      logoField.value = reader.result;
      showLogo(reader.result);
      message.textContent = 'Logo sélectionné. Cliquez sur Enregistrer.';
    };

    reader.onerror = () => {
      message.textContent = 'Impossible de lire le fichier logo.';
    };

    reader.readAsDataURL(file);
  };

  try {
    const result = await db
      .from('company_settings')
      .select('*')
      .eq('id', 1)
      .maybeSingle();

    if (result.error) throw result.error;

    if (result.data) {
      Object.entries(result.data).forEach(([key, value]) => {
        if (form.elements[key]) {
          form.elements[key].value = value ?? '';
        }
      });

      showLogo(result.data.logo_url || '');
    }
  } catch (error) {
    message.textContent = 'Erreur de chargement : ' + error.message;
    return;
  }

  form.onsubmit = async (event) => {
    event.preventDefault();

    const data = Object.fromEntries(new FormData(form).entries());

    data.id = 1;
    data.updated_at = new Date().toISOString();

    const result = await db
      .from('company_settings')
      .upsert(data, { onConflict: 'id' });

    if (result.error) {
      message.textContent = 'Erreur de sauvegarde : ' + result.error.message;
      return;
    }

    message.textContent =
      'Informations de l’entreprise et logo enregistrés avec succès.';
  };
}


async function go(p) {
  page = p;
  renderNav();
  $('toolbar').innerHTML = '';
  $('content').innerHTML = '<div class="panel">Chargement…</div>';

  try {
    if (p === 'dashboard') return await dashboard();
    if (p === 'driver') return await driverPage();
    if (p === 'proposal') return await proposalPage();
    if (p === 'proposals') return await proposalsPage();
    if (p === 'users') return await usersPage();
    if (p === 'audit') return await auditPage();
    if (p === 'trips') return await tripsPage();
    if (p === 'alerts') return await alertsPage();
    if (p === 'invoices') return await invoicesPage();
    if (p === 'gps') return await gpsPage();
    if (p === 'employees') return await employeesPage();
    if (p === 'payroll') return await payrollPage();

    // Nouvelle rubrique
    if (p === 'company') return await companyPage();
    if (p === 'cities') return await citiesPage();

    if (!CONFIG[p]) throw Error('Rubrique inconnue');
    await genericPage(p);

  } catch (e) {
    showError('content', e.message || String(e));
  }
}
function heading(t,s){$('title').textContent=t;$('subtitle').textContent=s}
function buildTripAlerts(trips){const today=new Date();today.setHours(0,0,0,0);const items=[];for(const t of trips){if(!['À planifier','En cours'].includes(t.status))continue;const ref='Mission '+(t.reference||'—');if(!t.vehicle_id)items.push({id:t.id,reference:t.reference,type:'Véhicule non attribué',detail:ref+' : aucun véhicule attribué.',level:'À traiter'});if(!t.driver_id)items.push({id:t.id,reference:t.reference,type:'Conducteur non attribué',detail:ref+' : aucun conducteur affecté.',level:'À traiter'});if(!t.departure_date||!t.arrival_date)items.push({id:t.id,reference:t.reference,type:'Dates incomplètes',detail:ref+' : date de départ ou d’arrivée manquante.',level:'À traiter'});if(t.arrival_date){const arrival=new Date(t.arrival_date+'T00:00:00');if(arrival<today)items.push({id:t.id,reference:t.reference,type:'Mission en retard',detail:ref+' : date d’arrivée prévue dépassée, statut « '+t.status+' ».',level:'Urgent'});}if(t.status==='À planifier'&&t.departure_date){const departure=new Date(t.departure_date+'T00:00:00');if(departure<today)items.push({id:t.id,reference:t.reference,type:'Départ non confirmé',detail:ref+' : date de départ dépassée mais mission toujours à planifier.',level:'Urgent'});}}return items} 
async function dashboard(){heading('Tableau de bord','Vue générale de l’activité · Cliquez sur une carte pour consulter le détail');const sections=[['Véhicules','vehicles'],['Conducteurs','drivers'],['Clients','clients'],['Missions','trips']];let counts=[];for(const [n,t] of sections){const q=await db.from(t).select('id',{count:'exact',head:true});if(q.error)throw q.error;counts.push([n,q.count||0,t])}const q=await db.from('trips').select('*');if(q.error)throw q.error;const active=q.data.filter(x=>x.status==='En cours').length,done=q.data.filter(x=>x.status==='Terminée').length,alerts=buildTripAlerts(q.data);let html='<div class="cards">';counts.forEach(x=>html+=`<button type="button" class="dashboard-card" data-dash-page="${x[2]}"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div><div class="muted">Cliquer pour ouvrir</div></button>`);html+=`<button type="button" class="dashboard-card" data-dash-filter="En cours"><div class="muted">Missions en cours</div><div class="metric">${active}</div><div class="muted">Cliquer pour filtrer</div></button><button type="button" class="dashboard-card" data-dash-filter="Terminée"><div class="muted">Missions terminées</div><div class="metric">${done}</div><div class="muted">Cliquer pour filtrer</div></button><button type="button" class="dashboard-card alert-card" data-dash-page="alerts"><div class="muted">Alertes</div><div class="metric">${alerts.length}</div><div class="muted">Cliquer pour consulter</div></button></div><div class="panel"><h2>Bienvenue dans FRET MANAGER</h2><p class="muted">Espace : ${ROLE_NAMES[profile.role]}. Les informations affichées dépendent de vos autorisations.</p><div class="notice">Les recettes et dépenses sont suivies mission par mission. Consultez « Dépenses & rentabilité » pour le détail comptable.</div></div>`;$('content').innerHTML=html;$('content').querySelectorAll('[data-dash-page]').forEach(b=>b.onclick=()=>{tripStatusFilter=null;go(b.dataset.dashPage)});$('content').querySelectorAll('[data-dash-filter]').forEach(b=>b.onclick=()=>{tripStatusFilter=b.dataset.dashFilter;go('trips')})}
async function alertsPage(){heading('Alertes','Missions nécessitant une vérification');const q=await db.from('trips').select('*').order('departure_date',{ascending:true});if(q.error)throw q.error;const alerts=buildTripAlerts(q.data||[]);if(!alerts.length){$('content').innerHTML='<div class="panel empty">Aucune alerte détectée. Toutes les missions actives ont été vérifiées.</div>';return}let html='<div class="notice">Les alertes sont calculées automatiquement à partir des missions actives. Les missions terminées et annulées sont exclues.</div><div class="tablewrap"><table><thead><tr><th>Priorité</th><th>Mission</th><th>Type d’alerte</th><th>Détail</th><th>Action</th></tr></thead><tbody>';alerts.forEach(a=>{html+=`<tr><td><span class="badge ${a.level==='Urgent'?'red':'amber'}">${a.level}</span></td><td>${escapeHtml(a.reference||'—')}</td><td>${escapeHtml(a.type)}</td><td>${escapeHtml(a.detail)}</td><td><button type="button" class="secondary smallbtn" data-alert-detail="${a.id}">Ouvrir la mission</button></td></tr>`});$('content').innerHTML=html+'</tbody></table></div>';$('content').querySelectorAll('[data-alert-detail]').forEach(b=>b.onclick=()=>missionDetail(b.dataset.alertDetail))}
function addToolbar(label,action=true){$('toolbar').innerHTML='';if(action){const b=document.createElement('button');b.textContent=label;b.onclick=()=>openRecord();$('toolbar').append(b)}const s=document.createElement('input');s.placeholder='Rechercher…';s.id='searchbox';s.oninput=()=>filterRows(s.value);$('toolbar').append(s)}

async function employeesPage(){

async function payrollPage(){
  if(!can(['admin','comptable']))throw Error('Accès réservé à l’administration et à la comptabilité.');
  heading('Paie','Salaires, charges patronales et affectation aux missions');
  $('toolbar').innerHTML='<button id="addPayroll">+ Enregistrer une paie</button>';
  $('addPayroll').onclick=()=>openPayrollForm();
  const [pq,eq,aq]=await Promise.all([db.from('payroll').select('*').order('period_start',{ascending:false}),db.from('employees').select('id,full_name').order('full_name'),db.from('payroll_allocations').select('payroll_id,amount')]);

  const totals={};list.forEach(p=>{const c=p.currency||'MAD';if(!totals[c])totals[c]={cost:0,allocated:0};totals[c].cost+=Number(p.total_cost||0);totals[c].allocated+=allocated.get(p.id)||0});

  $('content').innerHTML=html;
  $('content').querySelectorAll('[data-payroll-allocate]').forEach(b=>b.onclick=()=>openPayrollAllocations(b.dataset.payrollAllocate));
  $('content').querySelectorAll('[data-payroll-edit]').forEach(b=>b.onclick=()=>openPayrollForm(list.find(p=>p.id===b.dataset.payrollEdit)));
  $('content').querySelectorAll('[data-payroll-delete]').forEach(b=>b.onclick=()=>deletePayroll(b.dataset.payrollDelete));

async function deletePayroll(id){if(!confirm('Supprimer cette ligne de paie et ses affectations aux missions ?'))return;const r=await db.from('payroll').delete().eq('id',id);if(r.error){notify('Suppression impossible : '+r.error.message);return;}await payrollPage()}
async function openPayrollAllocations(payrollId){
  if(!can(['admin','comptable']))return;
  const [pq,aq,tq]=await Promise.all([db.from('payroll').select('*').eq('id',payrollId).single(),db.from('payroll_allocations').select('*').eq('payroll_id',payrollId).order('created_at'),db.from('trips').select('id,reference,departure,destination,currency,status').order('created_at',{ascending:false}).limit(1000)]);
  if(pq.error)throw pq.error;if(aq.error)throw aq.error;if(tq.error)throw tq.error;
  const pay=pq.data,employeeQ=await db.from('employees').select('full_name').eq('id',pay.employee_id).maybeSingle();if(employeeQ.error)throw employeeQ.error;
  const allocs=aq.data||[],trips=tq.data||[],allocated=allocs.reduce((n,a)=>n+Number(a.amount||0),0),remaining=Math.max(0,Number(pay.total_cost||0)-allocated),tripMap=new Map(trips.map(t=>[t.id,t]));
  allocationEditingId=null;
  $('modaltitle').textContent='Affectation de la paie · '+(pay.period_start||'')+' → '+(pay.period_end||'');
  const compatible=trips.filter(t=>(t.currency||'MAD')===(pay.currency||'MAD'));
  $('fields').innerHTML=`<div class="notice">Salarié : <b>${escapeHtml(employeeQ.data?.full_name||'Salarié')}</b> · Coût total : <b>${money(pay.total_cost,pay.currency)}</b> · Déjà affecté : <b>${money(allocated,pay.currency)}</b> · Reste à affecter : <b>${money(remaining,pay.currency)}</b>. Les missions proposées ont la même devise que la paie.</div><h3>Affectations enregistrées</h3><div class="tablewrap"><table><thead><tr><th>Mission</th><th>Trajet</th><th>Montant affecté</th><th>Note</th><th>Actions</th></tr></thead><tbody>${allocs.map(a=>{const t=tripMap.get(a.trip_id);return `<tr><td>${escapeHtml(t?.reference||a.trip_id)}</td><td>${escapeHtml((t?.departure||'')+' → '+(t?.destination||''))}</td><td>${money(a.amount,pay.currency)}</td><td>${escapeHtml(a.notes||'—')}</td><td><div class="actions"><button type="button" class="secondary smallbtn" data-alloc-edit="${a.id}">Modifier</button><button type="button" class="danger smallbtn" data-alloc-delete="${a.id}">Supprimer</button></div></td></tr>`}).join('')||'<tr><td colspan="5">Aucune affectation pour cette paie.</td></tr>'}</tbody></table></div><div class="section"><h3 id="alloc-form-title">Ajouter une affectation</h3><div class="fields"><div class="field full"><label>Mission *</label><select id="alloc_trip"><option value="">— Choisir une mission —</option>${compatible.map(t=>`<option value="${t.id}">${escapeHtml(t.reference||'Mission')} · ${escapeHtml(t.departure||'')} → ${escapeHtml(t.destination||'')} · ${escapeHtml(t.currency||'MAD')}</option>`).join('')}</select></div><div><label>Montant à affecter *</label><input id="alloc_amount" type="number" min="0.01" step="0.01" max="${remaining}" placeholder="${remaining.toFixed(2)}"></div><div><label>Note</label><input id="alloc_notes"></div></div><div class="actions" style="margin-top:12px"><button type="button" id="alloc_save">Enregistrer l’affectation</button><button type="button" class="secondary" id="alloc_reset">Réinitialiser</button></div></div>`;
  $('modal').style.display='flex';
  const reset=()=>{allocationEditingId=null;$('alloc_trip').value='';$('alloc_amount').value='';$('alloc_notes').value='';$('alloc-form-title').textContent='Ajouter une affectation';$('alloc_save').textContent='Enregistrer l’affectation';};
  $('alloc_reset').onclick=reset;
  $('alloc_save').onclick=async()=>{const tripId=$('alloc_trip').value,amount=Number($('alloc_amount').value);if(!tripId||!Number.isFinite(amount)||amount<=0){notify('Choisissez une mission et saisissez un montant supérieur à zéro.');return;}const old=allocationEditingId?allocs.find(a=>a.id===allocationEditingId):null;const allowed=remaining+(old?Number(old.amount||0):0);if(amount>allowed+0.000001){notify('Le montant dépasse le solde disponible de cette paie.');return;}const payload={payroll_id:payrollId,trip_id:tripId,amount,notes:$('alloc_notes').value.trim()||null};const r=old?await db.from('payroll_allocations').update(payload).eq('id',old.id):await db.from('payroll_allocations').insert({...payload,created_by:currentUser.id});if(r.error){notify('Affectation refusée : '+r.error.message);return;}await openPayrollAllocations(payrollId);};
  $('content');
  $('fields').querySelectorAll('[data-alloc-edit]').forEach(b=>b.onclick=()=>{const a=allocs.find(x=>x.id===b.dataset.allocEdit);if(!a)return;allocationEditingId=a.id;$('alloc_trip').value=a.trip_id;$('alloc_amount').value=a.amount;$('alloc_notes').value=a.notes||'';$('alloc-form-title').textContent='Modifier une affectation';$('alloc_save').textContent='Enregistrer la modification';});
  $('fields').querySelectorAll('[data-alloc-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette affectation ?'))return;const r=await db.from('payroll_allocations').delete().eq('id',b.dataset.allocDelete);if(r.error){notify(r.error.message);return;}await openPayrollAllocations(payrollId);});
}

async function storeMissionFile(trip,file,kind,displayName){
 const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
 if(!allowed.includes(file.type)){notify('Format refusé. Formats acceptés : PDF, JPEG, PNG, WebP.');return false}
 if(file.size>25*1024*1024){notify('Fichier trop volumineux : limite 25 Mo.');return false}
 const safe=String(displayName||file.name||'fichier').normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'_');
 const path=`${trip.id}/${kind}/${Date.now()}_${safe}`;
 const up=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
 if(up.error){notify('Erreur de stockage : '+up.error.message);return false}
 const ins=await db.from('documents').insert({trip_id:trip.id,driver_id:profile.driver_id||null,document_type:kind,document_name:displayName||file.name,file_path:path,media_kind:kind,uploaded_by:currentUser.id});
 if(ins.error){notify('Fichier téléversé mais sa fiche documentaire a été refusée : '+ins.error.message+'\nLe fichier est dans le stockage sous : '+path+'\nUne règle de sécurité Supabase doit autoriser le conducteur à ajouter le document de sa propre mission.');return false}
 return path;
}
async function replaceMissionDocument(trip,doc,file){
  const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
  if(!allowed.includes(file.type)){notify('Format refusé. Formats acceptés : PDF, JPEG, PNG, WebP.');return;}
  if(file.size>25*1024*1024){notify('Fichier trop volumineux : limite 25 Mo.');return;}
  if(!confirm('Remplacer « '+(doc.document_name||'ce fichier')+' » par le nouveau fichier ?'))return;
  const safe=String(file.name||'fichier').normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'_');
  const kind=doc.media_kind==='signature'?'signature':(file.type==='application/pdf'?'document':'photo');
  const newPath=`${trip.id}/${kind}/${Date.now()}_${safe}`;
  const upload=await db.storage.from(BUCKET).upload(newPath,file,{upsert:false,contentType:file.type});
  if(upload.error){notify('Erreur de stockage : '+upload.error.message);return;}
  const update=await db.from('documents').update({
    file_path:newPath,
    document_name:file.name||doc.document_name,
    document_type:kind,
    media_kind:kind
  }).eq('id',doc.id).select('id').maybeSingle();
  if(update.error||!update.data){
    await db.storage.from(BUCKET).remove([newPath]);
    notify('Le remplacement a été refusé : '+(update.error?.message||'document introuvable ou accès non autorisé')+'. L’ancien fichier a été conservé.');
    return;
  }
  if(doc.file_path){
    const cleanup=await db.storage.from(BUCKET).remove([doc.file_path]);
    if(cleanup.error){
      notify('Nouveau fichier enregistré. Attention : l’ancien fichier n’a pas pu être supprimé du stockage : '+cleanup.error.message);
      await missionDetail(trip.id);
      return;
    }
  }
  notify('Fichier remplacé avec succès.');
  await missionDetail(trip.id);
}
async function deleteMissionDocument(doc){
  if(!doc)return;
  if(!confirm('Supprimer définitivement ce document et son fichier associé ?'))return;
  const del=await db.from('documents').delete().eq('id',doc.id).select('id').maybeSingle();
  if(del.error||!del.data){notify('Suppression refusée : '+(del.error?.message||'document introuvable ou accès non autorisé'));return;}
  if(doc.file_path){
    const storage=await db.storage.from(BUCKET).remove([doc.file_path]);
    if(storage.error){
      notify('La fiche du document a été supprimée, mais le fichier physique n’a pas pu être supprimé du stockage : '+storage.error.message+'. Signalez ce fichier à l’administrateur.');
      await missionDetail(doc.trip_id);
      return;
    }
  }
  notify('Document et fichier supprimés.');
  await missionDetail(doc.trip_id);
}

}
function initSignaturePad(trip){
 const canvas=$('signaturepad'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#17324d';
 let drawing=false,hasInk=false;
 const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
 canvas.onpointerdown=e=>{drawing=true;hasInk=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
 canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
 const stop=()=>{drawing=false};canvas.onpointerup=stop;canvas.onpointercancel=stop;canvas.onpointerleave=e=>{if(drawing&&e.buttons===0)stop()};
 $('clearsignature').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false};
 $('savesignature').onclick=async()=>{if(!hasInk){notify('La zone de signature est vide.');return}const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){notify('Impossible de préparer la signature.');return}const file=new File([blob],`signature_client_${trip.reference||trip.id}.png`,{type:'image/png'});const ok=await storeMissionFile(trip,file,'signature',`Signature client - ${trip.reference||trip.id}.png`);if(ok){notify('Signature du client enregistrée.');await missionDetail(trip.id)}};
}

async function renderExpenses(list){
  const [tq,pq,aq]=await Promise.all([
    db.from('trips').select('id,reference,departure,destination,revenue,currency,status,departure_date').order('created_at',{ascending:false}).limit(1000),
    db.from('payroll').select('id,total_cost,currency,period_start,period_end'),
    db.from('payroll_allocations').select('id,payroll_id,trip_id,amount')
  ]);
  if(tq.error)throw tq.error;if(pq.error)throw pq.error;if(aq.error)throw aq.error;
  const trips=tq.data||[],tripMap=new Map(trips.map(t=>[t.id,t]));
  const payroll=pq.data||[],allocations=aq.data||[];
  const totals={};
  const ensure=c=>{if(!totals[c])totals[c]={revenue:0,expenses:0,payroll:0};return totals[c]};
  trips.forEach(t=>ensure(t.currency||'MAD').revenue+=Number(t.revenue||0));
  list.forEach(e=>ensure(e.currency||'MAD').expenses+=Number(e.amount||0));
  payroll.forEach(p=>ensure(p.currency||'MAD').payroll+=Number(p.total_cost||0));
  const currencies=Object.keys(totals).sort();
  const allocatedByTrip=new Map(),allocatedByPayroll=new Map();
  allocations.forEach(a=>{allocatedByTrip.set(a.trip_id,(allocatedByTrip.get(a.trip_id)||0)+Number(a.amount||0));allocatedByPayroll.set(a.payroll_id,(allocatedByPayroll.get(a.payroll_id)||0)+Number(a.amount||0))});
  const unallocatedByCurrency={};
  payroll.forEach(p=>{const c=p.currency||'MAD';unallocatedByCurrency[c]=(unallocatedByCurrency[c]||0)+Math.max(0,Number(p.total_cost||0)-(allocatedByPayroll.get(p.id)||0))});
  let html='<div class="notice"><b>Règles comptables :</b> les recettes proviennent exclusivement de <code>trips.revenue</code>. Les dépenses ordinaires proviennent de <code>expenses</code>. Le coût total des salaires et charges est comptabilisé une seule fois au niveau de l’entreprise depuis <code>payroll.total_cost</code>. Les affectations aux missions ventilent ce coût déjà comptabilisé : elles ne sont jamais ajoutées une deuxième fois aux charges globales. MAD et EUR restent séparés.</div>';
  html+='<div class="cards">'+currencies.map(c=>{const v=totals[c],result=v.revenue-v.expenses-v.payroll,margin=v.revenue?result/v.revenue*100:null;return `<div class="card"><div class="muted">Synthèse · ${escapeHtml(c)}</div><div class="muted">Recettes missions</div><div class="metric">${money(v.revenue,c)}</div><div class="muted">Dépenses ordinaires</div><b>${money(v.expenses,c)}</b><div class="muted">Salaires + charges</div><b>${money(v.payroll,c)}</b><div class="section"><div class="muted">Résultat global après paie</div><div class="metric" style="color:${result<0?'var(--red)':'var(--green)'}">${money(result,c)}</div><div class="muted">Marge : ${margin===null?'—':margin.toLocaleString('fr-FR',{maximumFractionDigits:2})+' %'}</div><div class="muted">Paie non affectée : ${money(unallocatedByCurrency[c]||0,c)}</div></div></div>`}).join('')+'</div>';
  const byTrip=new Map();
  trips.forEach(t=>{const c=t.currency||'MAD';byTrip.set(t.id,{trip:t,currency:c,revenue:Number(t.revenue||0),expenses:0,payroll:0})});
  list.forEach(e=>{const x=byTrip.get(e.trip_id);if(x&&(e.currency||'MAD')===x.currency)x.expenses+=Number(e.amount||0)});
  allocations.forEach(a=>{const x=byTrip.get(a.trip_id);if(x)x.payroll+=Number(a.amount||0)});
  const missionRows=[...byTrip.values()].filter(x=>x.revenue!==0||x.expenses!==0||x.payroll!==0).sort((a,b)=>String(b.trip.departure_date||'').localeCompare(String(a.trip.departure_date||'')));
  html+='<div class="panel"><h2>Rentabilité par mission</h2><p class="muted">Le coût salarial affecté à chaque mission est inclus dans son résultat. La partie non affectée reste comptabilisée uniquement dans le résultat global de l’entreprise.</p>';
  if(missionRows.length){html+='<div class="tablewrap"><table><thead><tr><th>Mission</th><th>Trajet</th><th>Statut</th><th>Devise</th><th>Recette</th><th>Dépenses directes</th><th>Paie affectée</th><th>Résultat mission</th></tr></thead><tbody>';missionRows.forEach(x=>{const result=x.revenue-x.expenses-x.payroll;html+=`<tr><td><b>${escapeHtml(x.trip.reference||'—')}</b></td><td>${escapeHtml(x.trip.departure||'—')} → ${escapeHtml(x.trip.destination||'—')}</td><td>${escapeHtml(x.trip.status||'—')}</td><td>${escapeHtml(x.currency)}</td><td>${money(x.revenue,x.currency)}</td><td>${money(x.expenses,x.currency)}</td><td>${money(x.payroll,x.currency)}</td><td><b style="color:${result<0?'var(--red)':'var(--green)'}">${money(result,x.currency)}</b></td></tr>`});html+='</tbody></table></div>'}else html+='<div class="empty">Aucune recette, dépense ou paie affectée aux missions pour le moment.</div>';
  html+='</div><div class="panel" style="margin-top:14px"><div class="topline"><div><h2>Détail des dépenses</h2><p class="muted">Les actions de modification et suppression restent disponibles selon les droits Supabase.</p></div></div>';
  if(list.length){html+='<div class="tablewrap"><table><thead><tr><th>Mission</th><th>Type</th><th>Date</th><th>Montant</th><th>Description</th><th>Actions</th></tr></thead><tbody>';list.forEach(r=>{const t=tripMap.get(r.trip_id);html+=`<tr><td>${escapeHtml(t?.reference||'Mission introuvable')}</td><td>${escapeHtml(r.expense_type)}</td><td>${dateText(r.expense_date)}</td><td>${money(r.amount,r.currency)}</td><td>${escapeHtml(r.description)}</td><td><div class="actions"><button class="secondary smallbtn" data-edit="${r.id}">Modifier</button><button class="danger smallbtn" data-delete="${r.id}">Supprimer</button></div></td></tr>`});html+='</tbody></table></div>'}else html+='<div class="empty">Aucune dépense ordinaire.</div>';
  html+='</div>';$('content').innerHTML=html;
  $('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(list.find(x=>x.id===b.dataset.edit)));
  $('content').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete));
}

let invoiceRows = [], invoicePayments = [], invoiceEditingId = null;
function invoicePaymentState(inv, payments) {
  const paid=(payments||[]).filter(p=>p.invoice_id===inv.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const total=Number(inv.total_ttc||0), remaining=Math.max(0,total-paid);
  return {paid,remaining,state:paid<=0?'Non réglée':paid+0.005>=total?'Payée':'Partiellement réglée'};
}
function invoiceStatusLabel(inv,payments) {
  if(inv.status==='draft')return 'Brouillon';
  if(inv.status==='cancelled')return 'Annulée';
  return invoicePaymentState(inv,payments).state;
}
function invoiceStatusClass(s){return s==='Payée'?'green':s==='Annulée'?'red':s==='Brouillon'||s==='Non réglée'?'amber':'';}

   invoiceRows.forEach(x=>{

  $('form').onsubmit=saveInvoice;$('modal').style.display='flex';

async function saveInvoice(e){
  e.preventDefault();
  const payload={service_description:$('inv_desc').value.trim(),amount_basis:$('inv_basis').value,
    entered_amount:Number($('inv_amount').value),tax_rate:Number($('inv_tax').value),
    issue_date:$('inv_issue').value,due_date:$('inv_due').value||null,notes:$('inv_notes').value.trim()||null};
  if(!payload.service_description||!payload.amount_basis||!Number.isFinite(payload.entered_amount)||payload.entered_amount<=0||
    !Number.isFinite(payload.tax_rate)||payload.tax_rate<0||payload.tax_rate>100||!payload.issue_date){notify('Vérifiez la description, la base HT/TTC, le montant, le taux TVA et la date.');return;}
  let q;if(invoiceEditingId)q=await db.from('invoices').update(payload).eq('id',invoiceEditingId).select().single();
  else{payload.trip_id=$('inv_trip_id').value;if(!payload.trip_id){notify('Sélectionnez une mission.');return;}q=await db.from('invoices').insert(payload).select().single();}

}

async function deleteInvoiceRecord(id){
  if(!can(['admin'])){notify('La suppression des factures est réservée à l’administrateur.');return;}
  const p=await db.from('invoice_payments').select('id,amount,payment_date').eq('invoice_id',id).limit(1);
  if(p.error){notify('Vérification des règlements impossible : '+p.error.message);return;}
  if((p.data||[]).length){notify('Suppression bloquée : cette facture possède déjà un ou plusieurs règlements. L’historique comptable est protégé.');return;}
  const inv=invoiceRows.find(x=>x.id===id);
  const number=inv?.invoice_number||'cette facture';
  if(!confirm('Supprimer définitivement '+number+' ?\nCette action est réservée à l’administrateur. Aucun règlement associé n’a été trouvé.'))return;
  const r=await db.from('invoices').delete().eq('id',id).select('id').maybeSingle();
  if(r.error){notify('Suppression refusée par Supabase : '+r.error.message);return;}
  if(!r.data){notify('Suppression non effectuée : facture introuvable ou droits insuffisants.');return;}
  notify('Facture supprimée.');
  closeModal();
  await invoicesPage();
}
function openPaymentForm(inv,remaining,payment=null){

let gpsTab='map',gpsMap=null;
function gpsNav(){const a=[['map','Carte & flotte'],['devices','Boîtiers GPS'],['alerts','Alertes GPS'],['trips','Trajets / missions'],['zones','Zones géographiques'],['events','Événements']];
  return `<div class="subnav">${a.map(([id,label])=>`<button type="button" class="${gpsTab===id?'active':''}" data-gps-tab="${id}">${label}</button>`).join('')}</div>`;}
async function gpsPage(){
  if(!can(['admin','logistique']))throw Error('Accès GPS non autorisé.');
  heading('Suivi GPS','Suivi des véhicules par boîtier GPS embarqué');
  const [d,p,a]=await Promise.all([db.from('gps_devices').select('*').order('created_at',{ascending:false}),db.from('gps_positions').select('*').order('recorded_at',{ascending:false}).limit(1000),db.from('gps_alerts').select('*').order('occurred_at',{ascending:false}).limit(500)]);
  if(d.error)throw d.error;if(p.error)throw p.error;if(a.error)throw a.error;
  const devices=d.data||[],positions=p.data||[],alerts=a.data||[],latest=new Map();
  positions.forEach(x=>{if(!latest.has(x.vehicle_id))latest.set(x.vehicle_id,x);});
  const online=devices.filter(x=>x.status==='active'&&x.last_seen_at&&(Date.now()-new Date(x.last_seen_at).getTime())<600000).length;
  $('content').innerHTML=`<div class="notice">Les positions proviennent des boîtiers installés dans les camions. Le navigateur est en lecture seule pour les positions ; seul le backend GPS sécurisé peut les transmettre. Le fournisseur GPS reste à connecter.</div>
  <div class="cards"><div class="card"><div class="muted">Boîtiers enregistrés</div><div class="metric">${devices.length}</div></div><div class="card"><div class="muted">Boîtiers actifs récemment</div><div class="metric">${online}</div></div><div class="card"><div class="muted">Véhicules avec position connue</div><div class="metric">${latest.size}</div></div><div class="card"><div class="muted">Alertes non traitées</div><div class="metric">${alerts.filter(x=>!x.acknowledged).length}</div></div></div>${gpsNav()}<div id="gpsbody"></div>`;
  $('content').querySelectorAll('[data-gps-tab]').forEach(b=>b.onclick=()=>{gpsTab=b.dataset.gpsTab;gpsPage();});
  const body=$('gpsbody');
  if(gpsTab==='map')await gpsMapPage(body,devices,latest);
  else if(gpsTab==='devices')gpsDevicesPage(body,devices);
  else if(gpsTab==='alerts')gpsAlertsPage(body,alerts);
  else if(gpsTab==='trips')await gpsTripSummariesPage(body);
  else if(gpsTab==='zones')await gpsZonesPage(body);
  else if(gpsTab==='events')await gpsEventsPage(body);
}
async function gpsMapPage(body,devices,latest){
  body.innerHTML=`<div class="topline"><h2>Dernière position connue des véhicules</h2><button type="button" class="secondary" id="gpsrefresh">Actualiser</button></div><div id="gpsmap" class="gps-map"></div>

  ${Array.from(latest.values()).map(x=>{const v=lookups.vehicles.find(z=>z.id===x.vehicle_id),d=devices.find(z=>z.vehicle_id===x.vehicle_id);return `<tr><td>${escapeHtml(v?.registration||x.vehicle_id)}</td><td>${Number(x.latitude).toFixed(5)}, ${Number(x.longitude).toFixed(5)}<br>${new Date(x.recorded_at).toLocaleString('fr-FR')}</td><td>${x.speed_kmh==null?'—':escapeHtml(x.speed_kmh)+' km/h'}</td><td>${d?.last_seen_at?new Date(d.last_seen_at).toLocaleString('fr-FR'):'—'}</td><td>${escapeHtml(lookups.trips.find(t=>t.id===x.trip_id)?.reference||'—')}</td></tr>`;}).join('')||'<tr><td colspan="5">Aucune position reçue. Le raccordement au fournisseur GPS est nécessaire.</td></tr>'}

  if(gpsMap){gpsMap.remove();gpsMap=null;}
  gpsMap=L.map('gpsmap').setView([31.7917,-7.0926],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(gpsMap);
  const bounds=[];latest.forEach(x=>{const v=lookups.vehicles.find(z=>z.id===x.vehicle_id),m=L.marker([x.latitude,x.longitude]).addTo(gpsMap);
    m.bindPopup(`<b>${escapeHtml(v?.registration||'Véhicule')}</b><br>Vitesse : ${x.speed_kmh==null?'—':escapeHtml(x.speed_kmh)+' km/h'}<br>${new Date(x.recorded_at).toLocaleString('fr-FR')}`);bounds.push([x.latitude,x.longitude]);});
  if(bounds.length)gpsMap.fitBounds(bounds,{padding:[25,25],maxZoom:12});setTimeout(()=>gpsMap&&gpsMap.invalidateSize(),100);
}

async function openGpsDeviceForm(row=null){
  if(!can(['admin']))return;const q=await db.from('vehicles').select('id,registration,brand,model').order('registration');if(q.error){notify(q.error.message);return;}
  const opts=(q.data||[]).map(v=>`<option value="${v.id}" ${v.id===row?.vehicle_id?'selected':''}>${escapeHtml(v.registration)} · ${escapeHtml(v.brand||'')} ${escapeHtml(v.model||'')}</option>`).join('');
  $('modaltitle').textContent=row?'Modifier le boîtier GPS':'Ajouter un boîtier GPS';
  $('fields').innerHTML=`<div class="notice">Un boîtier principal est associé à chaque véhicule. Les identifiants sont fournis par le prestataire GPS.</div><div class="fields">
  <div class="field full"><label>Véhicule *</label><select id="gd_vehicle" required><option value="">— Choisir —</option>${opts}</select></div>
  <div><label>Nom du boîtier</label><input id="gd_name" value="${escapeHtml(row?.device_name||'')}"></div><div><label>Fournisseur GPS</label><input id="gd_provider" value="${escapeHtml(row?.provider||'')}"></div>
  <div><label>IMEI</label><input id="gd_imei" value="${escapeHtml(row?.imei||'')}"></div><div><label>ID appareil fournisseur</label><input id="gd_pid" value="${escapeHtml(row?.provider_device_id||'')}"></div>
  <div><label>État</label><select id="gd_status"><option value="inactive">Inactif</option><option value="active">Actif</option><option value="maintenance">Maintenance</option><option value="offline">Hors ligne</option></select></div><div><label>Date installation</label><input id="gd_date" type="date" value="${row?.installed_at||''}"></div></div>`;
  $('gd_status').value=row?.status||'inactive';
  $('form').onsubmit=async e=>{e.preventDefault();const payload={vehicle_id:$('gd_vehicle').value,device_name:$('gd_name').value.trim()||null,provider:$('gd_provider').value.trim()||null,imei:$('gd_imei').value.trim()||null,provider_device_id:$('gd_pid').value.trim()||null,status:$('gd_status').value,installed_at:$('gd_date').value||null};
    const r=row?await db.from('gps_devices').update(payload).eq('id',row.id):await db.from('gps_devices').insert(payload);
    if(r.error){notify('Erreur boîtier : '+r.error.message);return;}closeModal();notify('Boîtier GPS enregistré.');gpsTab='devices';gpsPage();};
  $('modal').style.display='flex';
}

  ${alerts.map(x=>`<tr><td><span class="badge ${x.severity==='critical'||x.severity==='high'?'red':'amber'}">${escapeHtml(x.severity)}</span></td><td>${escapeHtml(lookups.vehicles.find(v=>v.id===x.vehicle_id)?.registration||x.vehicle_id)}</td><td>${escapeHtml(x.alert_type)}</td><td><b>${escapeHtml(x.title)}</b><br>${escapeHtml(x.description)}</td><td>${new Date(x.occurred_at).toLocaleString('fr-FR')}</td><td>${x.acknowledged?'Traitée':'À traiter'}</td><td>${!x.acknowledged?`<button class="secondary smallbtn" data-gps-ack="${x.id}">Marquer traitée</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">Aucune alerte GPS.</td></tr>'}</tbody></table></div>`;
  body.querySelectorAll('[data-gps-ack]').forEach(b=>b.onclick=async()=>{const r=await db.from('gps_alerts').update({acknowledged:true,acknowledged_by:currentUser.id,acknowledged_at:new Date().toISOString()}).eq('id',b.dataset.gpsAck);if(r.error){notify(r.error.message);return;}gpsPage();});

async function gpsZonesPage(body){
  const q=await db.from('gps_geofences').select('*').order('created_at',{ascending:false});if(q.error)throw q.error;const list=q.data||[];
  body.innerHTML=`<div class="topline"><h2>Zones géographiques</h2>${can(['admin'])?'<button id="gpsaddzone">+ Ajouter une zone</button>':''}</div><div class="notice">Les zones sont stockées en GeoJSON Polygon ou MultiPolygon. Le backend GPS devra comparer les positions reçues aux zones pour générer les alertes d’entrée et de sortie.</div>
  <div class="tablewrap"><table><thead><tr><th>Zone</th><th>Description</th><th>Active</th><th>Alerte entrée</th><th>Alerte sortie</th><th>Action</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.description)}</td><td>${x.is_active?'Oui':'Non'}</td><td>${x.alert_on_entry?'Oui':'Non'}</td><td>${x.alert_on_exit?'Oui':'Non'}</td><td>${can(['admin'])?`<button class="secondary smallbtn" data-gps-zone="${x.id}">Modifier</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">Aucune zone configurée.</td></tr>'}</tbody></table></div>`;
  if($('gpsaddzone'))$('gpsaddzone').onclick=()=>openGpsZoneForm();body.querySelectorAll('[data-gps-zone]').forEach(b=>b.onclick=()=>openGpsZoneForm(list.find(x=>x.id===b.dataset.gpsZone)));
}
function openGpsZoneForm(row=null){
  if(!can(['admin']))return;$('modaltitle').textContent=row?'Modifier la zone':'Nouvelle zone géographique';
  $('fields').innerHTML=`<div class="fields"><div class="field full"><label>Nom *</label><input id="gz_name" required value="${escapeHtml(row?.name||'')}"></div><div class="field full"><label>Description</label><textarea id="gz_desc">${escapeHtml(row?.description||'')}</textarea></div>
  <div class="field full"><label>GeoJSON Polygon / MultiPolygon *</label><textarea id="gz_geo" required style="min-height:150px">${escapeHtml(row?JSON.stringify(row.geometry_json,null,2):'')}</textarea></div>
  <div><label>Active</label><select id="gz_active"><option value="true">Oui</option><option value="false">Non</option></select></div><div><label>Alerte entrée</label><select id="gz_entry"><option value="true">Oui</option><option value="false">Non</option></select></div><div><label>Alerte sortie</label><select id="gz_exit"><option value="true">Oui</option><option value="false">Non</option></select></div></div>`;
  $('gz_active').value=String(row?.is_active??true);$('gz_entry').value=String(row?.alert_on_entry??false);$('gz_exit').value=String(row?.alert_on_exit??true);
  $('form').onsubmit=async e=>{e.preventDefault();let geo;try{geo=JSON.parse($('gz_geo').value);if(!['Polygon','MultiPolygon'].includes(geo?.type))throw Error('Le type doit être Polygon ou MultiPolygon.');}catch(err){notify('GeoJSON invalide : '+err.message);return;}
    const payload={name:$('gz_name').value.trim(),description:$('gz_desc').value.trim()||null,geometry_json:geo,is_active:$('gz_active').value==='true',alert_on_entry:$('gz_entry').value==='true',alert_on_exit:$('gz_exit').value==='true'};
    const r=row?await db.from('gps_geofences').update(payload).eq('id',row.id):await db.from('gps_geofences').insert({...payload,created_by:currentUser.id});
    if(r.error){notify('Erreur zone : '+r.error.message);return;}closeModal();gpsTab='zones';gpsPage();};
  $('modal').style.display='flex';
}

// Installation PWA : n'intervient pas dans les données métier ni dans Supabase.
let deferredInstallPrompt=null;
const installButton=document.getElementById('installAppBtn');
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  if(installButton) installButton.hidden=false;
});
if(installButton){
  installButton.addEventListener('click',async()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    installButton.hidden=true;
  });
}
window.addEventListener('appinstalled',()=>{if(installButton)installButton.hidden=true;});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker non enregistré',err)));
}
